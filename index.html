function mPt(e){const r=$("#mcv").getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*192,y:(e.clientY-r.top)/r.height*320}}
$("#mini").addEventListener("pointerdown",e=>{if(!MS||MS.mode!=="play"||e.target.closest("button,#mCard,#mpad,#mab"))return;e.preventDefault();const p=mPt(e);MP.taps.push(p);MP.ptrs.add(e.pointerId);MP.pts.set(e.pointerId,{x:p.x,y:p.y});if(!MP.down)MP.down={x:p.x,y:p.y,x0:p.x,y0:p.y,id:e.pointerId,t0:performance.now()}});
$("#mini").addEventListener("pointermove",e=>{if(MP.pts.has(e.pointerId)){const q=mPt(e);MP.pts.set(e.pointerId,{x:q.x,y:q.y})}const d=MP.down;if(!d||d.id!==e.pointerId)return;const p=mPt(e);const dr=MP.drag||{x:p.x,y:p.y,dx:0,dy:0};dr.dx+=p.x-d.x;dr.dy+=p.y-d.y;dr.x=p.x;dr.y=p.y;MP.drag=dr;d.x=p.x;d.y=p.y});
const mUp=e=>{MP.ptrs.delete(e.pointerId);MP.pts.delete(e.pointerId);const d=MP.down;if(!d||d.id!==e.pointerId)return;const p=mPt(e),dx=p.x-d.x0,dy=p.y-d.y0;MP.ups.push({x:p.x,y:p.y,t:performance.now()-d.t0});
  if(Math.hypot(dx,dy)>=20&&performance.now()-d.t0<500)MP.swipe=Math.abs(dx)>Math.abs(dy)?(dx<0?"left":"right"):(dy<0?"up":"down");MP.down=null};
$("#mini").addEventListener("pointerup",mUp);$("#mini").addEventListener("pointercancel",mUp);
const mpad=$("#mpad"),mknob=$("#mknob");
function mPadMove(e){const r=mpad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=r.width*.36;
  if(d<10){MP.pdx=0;MP.pdy=0;mknob.style.transform="";return}
  const a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);MP.pdx=Math.round(Math.cos(a)*100)/100;MP.pdy=Math.round(Math.sin(a)*100)/100;
  const k=Math.min(d,m);mknob.style.transform=`translate(${Math.cos(Math.atan2(dy,dx))*k}px,${Math.sin(Math.atan2(dy,dx))*k}px)`}
mpad.addEventListener("pointerdown",e=>{e.preventDefault();MP.padId=e.pointerId;mpad.setPointerCapture(e.pointerId);mPadMove(e)});
mpad.addEventListener("pointermove",e=>{if(e.pointerId===MP.padId)mPadMove(e)});
const mPadEnd=e=>{if(e.pointerId===MP.padId){MP.padId=null;MP.pdx=0;MP.pdy=0;mknob.style.transform=""}};
mpad.addEventListener("pointerup",mPadEnd);mpad.addEventListener("pointercancel",mPadEnd);
[["mA","a"],["mB","b"]].forEach(([id,w])=>{const b=$("#"+id);
  b.addEventListener("pointerdown",e=>{e.preventDefault();b.classList.add("on");if(w==="a"){MP.aH=true;MP.aT=true}else{MP.bH=true;MP.bT=true}});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>{b.classList.remove("on");if(w==="a")MP.aH=false;else MP.bH=false}))});
function miniKey(e,k,down){
  if(!down){delete MK[k];return}
  if(k==="Escape"){e.preventDefault();miniPause();return}
  const onButton=!!document.activeElement&&document.activeElement.tagName==="BUTTON";
  if(!MS||MS.mode!=="play"){if(!e.repeat&&(k==="z"||((k==="Enter"||k===" ")&&!onButton))){const b=$("#mCard [data-main]");if(b){e.preventDefault();b.click()}}return}

   ${sec("Religion and worldview",`<p>${esc(c.rel)}</p>`)}${sec("Try this",`<p>${esc(c.prac)}</p>`)}${sec("Read this",`<p>${esc(c.book)}</p>`)}
   ${sec("Allies and rivals",`<p><b>Allies:</b> ${esc(c.al)}</p><p><b>Rivals:</b> ${esc(c.ri)}</p>`)}${sec("When and where",`<p>${esc(c.d)}. ${esc(c.pl)}</p>`)}${c.relic?"":sec("At a glance",`<p>${STAT_NAMES.map((n,i)=>`${n} ${c.st[i]}/10`).join(" · ")}</p>`)}
   <div class="stack" style="margin-top:14px"><button class="btn primary" data-act="close">Close</button></div></div>`);
}
function reflectSheet(id){
  sheetId=id;const cur=(P.r[id]&&P.r[id].t)||"";
  openModal(`<h3 class="studio-h">${esc(PH[id].n)}</h3><p><i>${esc(TALK[id].reflect)}</i></p><textarea id="reflectEditBox" maxlength="280" rows="4" style="width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical">${esc(cur)}</textarea><div class="stack" style="margin-top:14px"><button class="btn primary" data-act="reflectsavemodal" data-id="${id}">Save</button><button class="btn" data-act="close">Cancel</button></div>`);
}

/* ============ FLOW ============ */
function enterWorld(){enterLevel(P.lastLevel||"l1")}
function travelTo(id){ // decision D3: the Lands list and the "Travel on" button after a boss victory
  const D=LEVEL_DEFS[id];if(!D||!landOpen(id))return;
  if(CUR&&G&&CUR.id!==id){P.w[CUR.id]={x:pl.x,y:pl.y,r:CUR.rev||0};P.ts.w=Date.now()}
  P.lastLevel=id;persist();TK=null;clearInterval(typeT);if(signState)closeSign();panelView=null;closeModal();
  const lv=LEVELS.find(L=>L.id===id);loadAtlas(landKey(D));
  playStory([{lvl:"Level "+lv.num,text:REGIONS[id],art:artURL("region-"+id),hint:D.splashHint}],()=>whenLandReady(id,()=>enterLevel(id)));
}
function beginJourney(){
  const pages=[];
  if(!P.intro){
    const v=artURL("vid-intro");if(v)pages.push({video:v});
    pages.push({text:"Long ago, every land kept a great lamp burning, tended by thinkers who asked how we should live.",art:artURL("story-a"),page:1});
    pages.push({text:"Now the lamps are going dark. An emptiness creeps across the world, whispering that nothing matters.",art:artURL("story-b"),page:1});
    pages.push({text:"You are the Wanderer. You carry one small lantern. Walk the four lands, listen to the thinkers, and carry their light home.",art:artURL("story-c"),page:1});
  }
  if(P.lastLevel&&!landOpen(P.lastLevel))P.lastLevel="l1";
  const lid=P.lastLevel||"l1",def=LEVEL_DEFS[lid],lv=LEVELS.find(L=>L.id===lid);loadAtlas(landKey(def));
  pages.push({lvl:"Level "+lv.num,text:REGIONS[lid],art:artURL("region-"+lid),hint:def.splashHint});
  playStory(pages,()=>{P.intro=true;persist();whenLandReady(lid,enterWorld)});
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(!QUIET_ACTS.has(a))sfx("tap");
  if(a==="close"){if(t.classList.contains("overlay")&&e.target!==t)return;closeModal();return}
  if(MINI_ACTS.has(a)){if(t.classList.contains("wait"))return; /* Phase 38: a dim Begin waits for the art */miniAct(a);return}
  if(a==="begin")beginJourney();
  else if(a==="storynext")nextStory();
  else if(a==="storysound"){const v=$("#story video");if(v){v.muted=false;v.play().catch(()=>{})}const h=$("#story .snd");if(h)h.remove()}
  else if(a==="watch"){const from=panelFrom;panelView=null;playStory([{video:artURL(t.dataset.v)}],()=>{if(from==="world")show("world");else{refreshTitle();show("title")}})}
  else if(a==="cards"){panelFilter="all";if(screen==="panel"){panelView="cards";renderPanel()}else openPanel("cards",screen==="world"?"world":"title")}
  else if(a==="studio"){studioMsg="";if(screen==="panel"){panelView="studio";renderPanel()}else openPanel("studio",screen==="world"?"world":"title")}
  else if(a==="howto"){panelView="howto";renderPanel()}
  else if(a==="sound"){setSound(!SND_ON);if(screen==="panel")renderPanel();else if(screen==="mini")miniCard()}
  else if(a==="voice"){setVoice(!VOICE_ON);if(screen==="panel")renderPanel();else if(screen==="mini")miniCard()}
  else if(a==="calm"){CALM=!CALM;try{localStorage.setItem("examined-life-calm",CALM?"1":"0")}catch(e){}renderPanel()}
  else if(a==="journal"){panelView="journal";renderPanel();$("#panel").scrollTop=0}
  else if(a==="gallery"){const y=panelView==="gamesheet"?galY:0;openPanel("gallery",panelFrom);$("#panel").scrollTop=y}
  else if(a==="ggame"){galY=$("#panel").scrollTop;gsId=t.dataset.id;panelView="gamesheet";renderPanel();$("#panel").scrollTop=0}
  else if(a==="gplay")galleryPlay(t.dataset.id,+t.dataset.n||0);
  else if(a==="lands"){panelView="lands";renderPanel();$("#panel").scrollTop=0}
  else if(a==="travel")travelTo(t.dataset.l);
  else if(a==="resetask"){panelView="resetask";renderPanel()}
  else if(a==="newjourney")openPanel("resetask","title");
  else if(a==="resetyes"){P.c={};P.w={};P.f={};P.g={};P.intro=false;P.done=false;P.lastLevel="l1";P.ts.reset=Date.now();P.ts.w=P.ts.reset;persist();G=null;CUR=null;TK=null;signState=null;panelView=null;refreshTitle();beginJourney()}
  else if(a==="menu")openPanel("menu","world");
  else if(a==="closepanel")closePanel();
  else if(a==="totitle"){panelView=null;P.w[CUR.id]={x:pl.x,y:pl.y,r:CUR.rev||0};P.ts.w=Date.now();persist();refreshTitle();show("title")}
  else if(a==="filter"){panelFilter=t.dataset.f;renderPanel()}
  else if(a==="card")cardSheet(t.dataset.id);
  else if(a==="signnext")signNext();
  else if(a==="advance")advance();
  else if(a==="reply")reply(+t.dataset.k);
  else if(a==="choose")choose(+t.dataset.i);
  else if(a==="leavetalk")leaveTalk();
  else if(a==="revealdone"){const f=revealAfter;revealAfter=null;if(f)f();else show("world")}
  else if(a==="finale"){revealAfter=null;P.done=true;persist();playEnding()}
  else if(a==="watchending"){panelView=null;playEnding()}
  else if(a==="credits"){panelView=null;showCredits()}
  else if(a==="creditsboost"){creditsBoost=Math.min(6,creditsBoost+1.5)}
  else if(a==="creditsdone"){stopCredits();refreshTitle();show("title")}
  else if(a==="unmute"){const v=$("#vv");if(v){v.muted=false;v.play().catch(()=>{})}}
  else if(a==="vidnext"){const f=window._vidNext;window._vidNext=null;f&&f()}
  else if(a==="pickart"){if(!ASSETS||uploadingKey)return;pendingKey=t.dataset.key;const fp=$("#filepick");fp.accept=pendingKey.startsWith("vid-")?"video/mp4,video/webm,video/*":"image/*";fp.value="";fp.click()}
  else if(a==="removeart"){const k=t.dataset.key,old=P.a[k];delete P.a[k];P.ts.a=Date.now();persist();if(old&&old!==BUILTIN_ART[k]&&ASSETS)ASSETS.delete(old).catch(()=>{});studioMsg="Removed.";renderPanel();refreshTitle()}
  else if(a==="reflectsave"){const v=(($("#reflectBox")||{}).value||"").trim();P.r[TK.id]={t:v,at:Date.now()};persist();reflectAdvance()}
  else if(a==="reflectskip")reflectAdvance();
  else if(a==="reflectedit")reflectSheet(t.dataset.id);
  else if(a==="reflectclear"){P.r[t.dataset.id]={t:"",at:Date.now()};persist();renderPanel()}
  else if(a==="reflectsavemodal"){const id=t.dataset.id,v=(($("#reflectEditBox")||{}).value||"").trim();P.r[id]={t:v,at:Date.now()};persist();closeModal();renderPanel()}
});
$("#filepick").addEventListener("change",e=>handleFile(e.target.files&&e.target.files[0]));
refreshTitle();show("title");
try{loadAtlas(landKey(LEVEL_DEFS[P.lastLevel]||LEVEL_DEFS.l1));loadAtlas("chars")}catch(e){}
try{document.fonts&&document.fonts.load('20px "IM Fell English SC"')}catch(e){}
