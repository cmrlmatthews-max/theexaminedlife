 epicurus:{intro:["Come in, and close the gate behind you. The world outside is loud, and this garden doesn’t need it.","People hear “pleasure” and picture excess. I meant something far quieter than that.","Sit. Eat some bread. Let’s talk about what you’re actually afraid of."],q:[{say:"I taught that the good life is pleasure, but not the kind most people assume. What kind did I mean?",o:["A calm, untroubled mind, kept simple and free of needless fear","As much luxury and rich food as a person can afford","Constant excitement, chasing one new thrill after another","Pleasure earned only after a lifetime of hard discipline"],w:"Ataraxia: a calm, untroubled mind. Bread and water satisfy hunger as well as a feast does, and a feast just adds the worry of affording the next one.",fb:["Luxury often buys worry along with comfort. That’s the opposite of what I was after.","Chasing thrill after thrill is exhausting, not peaceful. My pleasure is quieter than that.","I never made peace a reward for suffering first. It’s available now, in a simple life."]},{say:"I sorted our wants into a few kinds. Which are worth chasing, and which should you simply let go of?",o:["Chase what’s natural and necessary; drop what’s empty, like endless riches","Chase whatever desire happens to strike you; restraint just breeds a deep frustration","Starve out desire itself, hunger and thirst included","Chase only the desires the city and its laws approve of"],w:"Natural, necessary wants, like food, shelter, and friendship, bring real peace. Empty wants, like endless wealth or fame, only breed more wanting.",fb:["Chasing whatever strikes you just multiplies your worry. Some wants are worth dropping outright.","I never asked anyone to starve. Natural, necessary wants like hunger deserve satisfying, not denial.","This was never about a city’s approval. It’s about which wants actually bring you peace."]},{t:"s",say:"A friend is terrified of dying, and can’t enjoy their days because of it. What would I tell them?",o:["Death is nothing to us; where death is, we are not, so don’t fear it","Death should be feared, since none of us know what follows it","Good people earn a peaceful death; the wicked have reason to fear it","Push the thought of death aside, and try to think of something else"],w:"Death is nothing to us. While we exist, death isn’t present, and once it is, we no longer are. The two never actually meet.",fb:["Fear of the unknown was exactly what I aimed to dissolve, not confirm.","I never tied death to virtue that way. My argument works the same for everyone alive.","I didn’t ask anyone to look away from it. I asked them to look straight at it, and see there’s nothing there to fear."]}],reflect:"What simple pleasure do you overlook, and which desire could you let go of?",bye:"Go gently, Wanderer. Keep your wants simple and your friends close.",back:"Back in the garden? Stay as long as the bread holds out."},
 seneca:{intro:["Sit. Mind the hourglass; I keep it where I can watch the sand fall.","People complain that life is short. I say we make it short, spending it carelessly.","Let’s see how you spend yours."],q:[{say:"People call life short. I disagreed, in a letter written on the subject. What did I actually argue?",o:["Life is long enough; we waste much of it on nothing","Life truly is short, and nothing can be done about it","Life feels short mainly to people who put off planning","Life is short, so we should chase pleasure while we can"],w:"We’re not given a short life. We make it short, wasting hours on things that don’t matter. Guard your time, and it’s long enough for great things.",fb:["I never accepted that verdict. The waste is ours to answer for, not time’s.","Planning helps, but that’s not quite my point. Most people plan plenty and still waste their days.","Chasing pleasure is its own way of wasting time. I asked for something steadier than that."]},{say:"I recommend imagining setbacks before they happen. What’s the actual point of rehearsing bad news in advance?",o:["It empties a setback of its shock, so it can’t ambush you later","It guarantees the bad thing will never actually happen","It teaches you to expect only good things from life","It’s simply a habit for people who enjoy worrying"],w:"Rehearsing a setback in your mind drains its power to surprise you. When it does come, and something eventually will, you meet it steady instead of stunned.",fb:["No rehearsal prevents fate. It only prepares you to meet it well.","I expected hardship, not only good news. That’s the whole reason to rehearse it.","This isn’t worry for its own sake. It’s preparation, aimed at calm, not anxiety."]},{t:"s",say:"A colleague snaps at you in anger over a small mistake, and later regrets it deeply. What would I say about anger, as I wrote it?",o:["Anger is a brief madness; better to pause before it speaks for you","Anger is useful, and should be let out fully every time","Anger is a sign of strength that others should respect","Anger should be pushed down and kept from view"],w:"Some wise men have called anger a brief madness, and I agreed. It grabs the wheel for a moment and leaves damage that lasts. Pause before it speaks for you.",fb:["Letting it out fully is exactly the mistake I warned against. Anger unspent still does its damage.","Strength isn’t what anger shows. It shows how easily a person can be provoked.","I never asked anyone to bury a feeling. I asked for a pause before it took the wheel."]}],reflect:"Where is your time leaking away, and what would you reclaim it for?",bye:"Go, and spend your hours as if they were the only ones you had.",back:"Back at my desk? Good. There’s always more to guard than time itself."},
 epictetus:{intro:["Sit on the stone if you like. I never needed much more than that myself.","Most people spend their whole lives upset about things that were never theirs to control.","Let’s sort out what’s actually yours."],q:[{say:"I split all of life into two piles. Which one is actually yours to work on?",o:["Only my own judgments, choices, and actions are truly mine","Everything is mine to control, if I simply try hard enough","Very little is mine; outcomes mostly get decided elsewhere","Only my body and my possessions are truly mine"],w:"Some things are up to us: judgment, choice, desire, aversion. Everything else, health, reputation, other people, isn’t. Put your effort only where it’s actually yours.",fb:["Trying harder doesn’t move outcomes that were never yours. Effort belongs in the first pile, not the second.","That overcorrects badly. Your judgments and choices are always yours, whatever else happens around you.","Even the body can be taken or fail you. What’s truly, always yours is smaller and stranger than property."]},{say:"A storm wrecks a man’s ship, and he curses his terrible luck. What would I say is really upsetting him?",o:["Not the storm itself, but his own judgment about the storm","The storm itself, since storms are always genuinely terrible","The gods, who clearly picked him out to punish","His crew, for failing to sail around the weather"],w:"We’re disturbed not by events themselves but by our opinions about them. The storm is just wind and water. His curse is what’s adding the suffering.",fb:["Wind and water hand out no verdicts on their own. What he decides to make of them is where the trouble starts.","I don’t picture gods keeping score that way. Look closer to home for the real cause.","Blaming the crew points at the wrong target. Look instead at what he decided the wreck meant."]},{t:"s",say:"You’re passed over for a promotion you worked hard for. What’s the Stoic move here, as I’d teach it?",o:["Accept the outcome calmly, and keep tending your own effort","Demand an explanation until the decision gets reversed","Assume you weren’t good enough, and give up trying","Blame your manager loudly to anyone who’ll listen"],w:"The decision was never fully yours to control. Your effort and character are. Meet the outcome calmly, and keep tending what’s actually in your hands.",fb:["Demanding a reversal chases something that was never yours to command in the first place.","Giving up hands over the one thing that is yours: your own effort.","Blame spends energy on someone else’s choice, not your own judgment or work."]}],reflect:"What’s worrying you right now that isn’t actually up to you?",bye:"Go, and sort your worries before they sort you.",back:"Back at the benches? Good. There’s always more to divide into its piles."},
 marcus:{intro:["Sit by the fire. This camp has seen a long winter, and I expect a longer one still.","I write at night, to myself, no one else. It’s the only way I stay honest.","Let’s see what you’d write, if you ruled nothing but your own mind."],q:[{say:"When my troubles feel enormous, I picture something specific to shrink them. What is it, and why?",o:["Looking down on my life from high above, small within all space and time","Looking up to the gods for a clear sign of what to do","Looking back at my childhood to find where the trouble began","Looking forward to how future historians will one day judge my long reign"],w:"I imagine looking down from high above, watching my life shrink into one small thread among countless others. Most troubles lose their weight from up there.",fb:["I wasn’t waiting on a sign. This is a habit of imagination, not a plea for one.","Childhood rarely explains the trouble I mean. This view looks outward and upward, not backward.","Fame after death never steadied me. What steadies me is seeing my life’s true size, right now."]},{say:"Each morning, before I rise, I remind myself something about the people I’ll meet that day. What?",o:["I’ll meet difficult, ungrateful people, and I should expect it calmly","Everyone I meet today will treat me with total respect","I should avoid difficult people entirely, whatever it costs","Difficult people always deserve harsh punishment the moment they appear"],w:"I remind myself I’ll meet the meddling, the ungrateful, the arrogant, before I’ve even left my tent. Expecting it keeps their behavior from ambushing my mood.",fb:["I never expected that. Expecting the opposite is exactly what leaves a person unprepared for a hard day.","Avoiding people wasn’t the plan. Meeting them calmly, prepared, was.","Punishment wasn’t my morning wish. Patience, prepared in advance, was closer to it."]},{t:"s",say:"A soldier complains that the whole war, the whole empire, will be forgotten someday anyway. What would I say?",o:["True, and that’s exactly why doing your duty well, right now, matters","He’s right, so there’s no point doing your duty at all","He’s wrong; the empire will certainly be remembered forever","Complaints like his should be punished to keep up morale"],w:"Everything changes, and most of it fades. That’s nature, not a reason to slack. It’s exactly why the duty in front of you, done well, is what’s actually yours.",fb:["Impermanence was never my excuse for giving up. It was my reason to act well while I still could.","I made no such promise. Empires fade like everything else; I never pretended otherwise.","Punishing honest doubt wasn’t my instinct. Meeting it with a steadier answer was."]}],reflect:"Picture today from high above. What looks smaller from up there?",bye:"Do your duty, Wanderer, whatever else is true about how it ends.",back:"Back at the fire? Good. The camp is always short a steady mind."},
 buddha:{intro:["Sit here beneath the tree, Wanderer. This is where I finally stopped running from myself.","I spent years chasing every pleasure, then years starving myself of all of them. Neither one freed me.","Let’s look together at what actually causes suffering."],q:[{say:"At Sarnath, I gave my first teaching, and called it the Middle Way. What did I mean by it?",o:["A path between chasing every pleasure and starving yourself through harsh denial","A path that blends a little of every religion together","A path measured out as the exact halfway point between hard striving and complete resting","A path only monks who leave ordinary life behind can walk"],w:"Before I woke, I tried both extremes myself: luxury, then near-starvation. Neither ended my suffering. The Middle Way steers between indulgence and harsh self-denial.",fb:["I wasn’t blending creeds. I was describing a way of living I’d tested on my own body, between two failed extremes.","It isn’t a formula about effort split down the middle. It’s about avoiding indulgence on one side and punishing yourself on the other.","Plenty who never leave home walk this path too. It’s about how you meet each craving, not where you live."]},{say:"I taught that craving and clinging are the root of suffering. What did I mean by that?",o:["Holding tight to things that can’t last, and wanting life to be otherwise, causes suffering","Wanting anything at all, even food or rest, is forbidden","Only wealthy people suffer from craving; the poor are safe from it","Suffering comes as a fitting punishment sent down for something done long ago, in a past life"],w:"Craving isn’t wanting a meal when you’re hungry. It’s the grasping after things staying, or becoming something else, that never quite lets you rest, because everything changes.",fb:["I never forbade eating or resting. I pointed at grasping itself, not at having needs.","Craving reaches everyone; wealth just changes its costume. No one is naturally exempt.","I wasn’t assigning blame for a past life. I was naming a cause you can see right now, in this one."]},{t:"s",say:"A friend just got the promotion they wanted, but they’re already anxious it won’t last. What would I say is happening?",o:["They’re clinging to a pleasant thing, and that clinging is what’s making it painful","They should quit their new position right away, since success tends to lead toward suffering","They’re simply unlucky, and no amount of insight will help","They should ignore the feeling completely and pretend it isn’t there"],w:"The promotion itself isn’t the problem. The tight grip on ‘let this never change’ is what turns a good thing into a source of dread.",fb:["Quitting doesn’t touch the real cause. The clinging would just find a new object.","This isn’t luck. It’s a pattern you can actually see and loosen, once you look at it.","Looking away doesn’t loosen the grip either. Seeing the craving clearly is the beginning of freedom from it."]}],reflect:"What are you craving right now, and what would it feel like to set it down?",bye:"Walk gently, Wanderer. May you crave a little less than when you sat down.",back:"Back under the tree? Good. There’s always another craving worth looking at closely."},
 laozi:{intro:["Come through the gate, Wanderer. The river doesn’t hurry, and neither should you.","People wear themselves out pushing against the world. Water never pushes, and yet water wins.","Let’s see how hard you’re used to gripping things."],q:[{say:"I wrote about the Dao, ‘the Way.’ Why did I say it can’t really be named or explained?",o:["Any name only captures a piece of something that’s always changing and whole","Because it’s a state secret only emperors are allowed to learn","Because I still hadn’t found the right words to write it down clearly enough","Because it takes priests trained for many long decades to grasp it"],w:"The moment you name the Way, you’ve already frozen something that’s really flowing and whole. Words are useful pointers, but the Way itself slips past them.",fb:["It was never a secret kept from anyone by rank. It resists naming for everyone equally.","I wrote plenty about it. The trouble isn’t my effort; it’s that words themselves fall short of it.","No special training unlocks it. If anything, too much training in rigid ideas gets in the way."]},{say:"I taught wu wei, acting without forcing. What does that actually mean?",o:["Working with the grain of things instead of straining against them","Stepping back and quietly letting events unfold without taking any part in them","Waiting for someone else to do all the difficult work","Acting only when a fortune-teller says the timing is right"],w:"Wu wei isn’t laziness. It’s like a woodworker following the wood’s own grain: the work still gets done, just without straining against how things actually move.",fb:["It isn’t standing apart from the world entirely. A river still carves canyons; it just never forces its way through rock.","It isn’t passing the work to someone else. It’s changing how you do your own part.","No fortune-teller is involved. It’s about reading how things already move, not consulting an oracle."]},{t:"s",say:"A manager keeps forcing a struggling project forward by sheer will, and it keeps breaking down further. What would I tell them?",o:["Stop forcing it. Find where the project already wants to flow, and work with that","Push twice as hard, since force always wins eventually","Fire everyone involved and hope new people fix it","Set the project aside for good and move on to something else"],w:"Water wears down stone not by force but by yielding, again and again, along the path that’s actually open. Forcing a broken plan only breaks it further.",fb:["More force is exactly what’s already failing here. Twice the force just breaks it twice as fast.","This isn’t about blame. It’s about finding where things already want to move.","Walking away isn’t yielding either. Yielding still means staying with it, just working with its shape instead of against it."]}],reflect:"Where are you forcing something that might go better if you yielded?",bye:"Go easy, Wanderer. Let the water find its own way down.",back:"Back at the gate? Good. There’s always more to unlearn about pushing."},
 zhuangzi:{intro:["Sit under this old tree with me. No carpenter ever wanted it, which is exactly why it’s still standing.","I once dreamed I was a butterfly, floating happily, with no idea I was Zhuangzi. Then I woke up. Or did I?","Let’s loosen a few things you’re sure you know."],q:[{say:"After that dream, I asked a strange question. What was it, and why does it matter?",o:["Whether I was a man dreaming I was a butterfly, or a butterfly dreaming I was a man","Whether butterflies are smarter than most other insects","Whether dreaming itself is somehow a punishable waste of a person’s precious time","Whether I would ever learn to fly like the butterfly did"],w:"I couldn’t be certain which side of the dream was ‘real.’ The question matters because it loosens your grip on your own point of view being the only true one.",fb:["Insect intelligence was never the point. The point is how sure you can really be about your own perspective.","I never called dreaming wasteful. It cracked open a question worth keeping, not a habit worth scolding.","Flying isn’t what unsettled me. Not knowing which self was the dreamer is what unsettled me."]},{say:"I told a story about Cook Ding, whose knife stayed sharp for nineteen years cutting up oxen. What was his secret?",o:["He followed the natural openings in the ox instead of hacking against its structure","He simply bought a far more expensive knife than anyone else","He grew more forceful each year, cutting with a harder hand","He secretly replaced his dulling knife on a regular schedule"],w:"Cook Ding never forced his blade through bone. He found the natural gaps and let the knife glide through them, the way skill follows the grain of things.",fb:["The knife wasn’t expensive; it was ordinary. What made it last was how he moved it.","More force was never his method. Force is exactly what would have dulled the blade faster.","There was no swapping involved. The same blade lasted nineteen years because of how little it fought the ox."]},{t:"s",say:"A gnarled old tree in someone’s yard gets mocked as ‘good for nothing.’ What might I point out?",o:["Its very uselessness for lumber is exactly what let it grow old and tall","It should probably be chopped down immediately to make room for something more useful","Trees can’t really be useless; every tree secretly has a hidden purpose","Whoever mocks it must not understand basic gardening at all"],w:"A carpenter passed over a tree just like it, twisted and useless for lumber, and it lived on for centuries. What looks useless for one purpose may simply serve none, and thrive because of it.",fb:["Cutting it down is exactly the carpenter’s instinct I’m questioning here, not endorsing.","I’m not smuggling in a hidden purpose. Sometimes uselessness itself is the whole gift.","This was never about someone’s gardening knowledge. It’s about what ‘useful’ even means."]}],reflect:"What belief of yours might look different from someone else’s point of view?",bye:"Go on, and hold your certainties a little more loosely.",back:"Back under the tree? Good. There’s always another dream worth questioning."},
 confucius:{intro:["Come sit at the table, Wanderer. A shared meal teaches as much as any lecture.","My students wrote down what I said, since I never wrote much myself. Let’s see what stuck.","Let’s talk about how you treat the people closest to you."],q:[{say:"A student once asked me for one word to live by for a whole lifetime. What did I answer?",o:["Reciprocity: never do to others what you wouldn’t want done to yourself","Obedience: you should never question anyone who holds more authority than you do","Ambition: always place your own advancement above anyone else’s","Silence: it’s safest to never share your true opinion aloud"],w:"I answered with reciprocity. Ask yourself, before any act, whether you’d want it done to you. That one habit carries further than any long list of rules.",fb:["Obedience without judgment was never my answer. I asked for a habit of imagining yourself on the receiving end, not blind compliance.","Ambition over others runs opposite to what I meant. Reciprocity asks you to weigh their side, not just yours.","Silence protects no one’s character. I answered with a habit of care, not a habit of hiding."]},{say:"Ren, ‘humaneness,’ sits at the center of what I taught. What is it, in plain terms?",o:["Genuine care and goodness toward others, shown through how you actually treat them","Strict, formal politeness with no real feeling required behind it","A special virtue only rulers and nobles are capable of","Performing each and every ritual correctly and precisely, which by itself makes a person good"],w:"Ren isn’t a performance of manners. It’s the real thing underneath good manners: genuine care for others, shown in how you actually act toward them.",fb:["Empty formality is closer to what I warned against than what I meant by ren.","I never limited it to nobility. Anyone, in any station, can practice real care for others.","Ritual without the right heart behind it is hollow. Ren is the heart li is supposed to express."]},{t:"s",say:"A young man is technically polite to his aging parents, but clearly resents every visit. What might I say?",o:["Correct manners without real care fall short of what a good relationship actually asks","Correct politeness is what matters most; feelings underneath are beside the point","He should stop visiting entirely, since resentment makes the visits worthless","His parents are certainly to blame for however he feels now"],w:"Li, proper courtesy, is meant to carry real feeling, not replace it. Going through the motions while resenting every minute misses what the ritual was for.",fb:["Feelings underneath do matter to me. Manners alone were never the whole of it.","Walking away isn’t the lesson here. Bringing real care into the visits is.","I’m not assigning blame to the parents. I’m asking him to look at his own heart."]}],reflect:"Which relationship in your life could use more care or courtesy this week?",bye:"Go, and treat the next person you meet with real care, not just good manners.",back:"Back at the table? Good. There’s always another relationship worth tending."},
 dogen:{intro:["Come sit on this cushion, Wanderer. We’re not chasing anything here. We’re just sitting.","I once thought enlightenment was a prize waiting somewhere ahead. A cook in China changed my mind.","Let’s look at what you’re doing right now, instead of what you think comes next."],q:[{say:"I taught shikantaza, ‘just sitting.’ What makes it different from meditating in order to reach some goal?",o:["It isn’t a means to an end; doing it fully, right now, is already the whole practice","It’s a quicker technique for clearing your mind of racing thoughts","It only really counts if you manage to sit for many long hours without moving","It’s a private ritual reserved only for monks who have trained for many years in a temple"],w:"Most meditation aims at a future payoff: calm, insight, enlightenment. Shikantaza drops the aiming. Sitting itself, right now, is the practice, not a rehearsal for one.",fb:["Speed was never the point. Chasing a faster result is exactly the aiming I’m asking you to drop.","Hours logged aren’t the measure. A short sitting, fully present, is still the whole practice.","It isn’t reserved for monks alone. Anyone can sit down and simply sit."]},{say:"In the Genjōkōan I wrote, ‘To study the self is to forget the self.’ What does forgetting the self mean there?",o:["Letting go of the self as a separate thing, so you meet each moment directly","Wiping out your memories so the past stops weighing on you","Putting others’ needs first until your own no longer seem to matter","Studying yourself so closely that you finally find your one true self"],w:"Forgetting the self isn’t erasing anything. It’s dropping the habit of standing apart from your life, so the sitting, the cooking, and the whole world can be met directly.",fb:["Nothing gets erased. Your past is still yours. What falls away is the wall between you and this moment.","That’s kindness, and I admire it, but it isn’t what I meant. It still keeps a separate self doing the sacrificing.","That’s the search I’m asking you to drop. There’s no fixed self waiting at the bottom."]},{t:"s",say:"A cook in your kitchen treats each meal as a chore to rush through before something ‘more important.’ What might I say?",o:["Cooking done with full attention is already the important thing, not a delay before it","Cooking will always be lesser work than praying or studying scripture","Rushing through ordinary chores is perfectly fine, since only formal practice really counts","The cook should quit and find work that feels more meaningful"],w:"An old temple cook once asked me, in effect, if not now, when. Washing rice, drying mushrooms, none of it is beneath full attention. Done wholeheartedly, it’s already the practice, not a delay before it.",fb:["I never ranked cooking beneath prayer or study. Full attention in the kitchen is its own complete practice.","Rushing anything to get to ‘real’ practice misses the point entirely: this, right now, already is it.","Quitting swaps one hurried task for another. The attention has to change, not just the job."]}],reflect:"What ordinary task could you do today with your whole attention?",bye:"Go, and give your next task your whole attention, however small it looks.",back:"Back on the cushion? Good. There’s always another moment worth sitting in."},
 aquinas:{intro:["Sit here beneath the rose window, Wanderer. My classmates once called me the dumb ox, too quiet, too slow. My teacher told them that ox would bellow loud enough to be heard around the world.","I spent my life trying to show that faith and reason are not two roads pointed in different directions.","Let’s look at how they actually work together."],q:[{say:"I taught that faith and reason can’t really be enemies. Why not?",o:["Because both come from God, so real reason can’t contradict real faith","Because reason is a dangerous distraction that faith should avoid entirely","Because faith is just an outdated stand-in for what reason will eventually replace","Because faith and reason answer different questions, so they never meet"],w:"Faith and reason share one source. If they ever seem to clash, we’ve misunderstood one of them, not found a real contradiction.",fb:["I never asked you to set reason aside. I built whole arguments for God’s existence with it.","Reason doesn’t replace faith in my view. It can lead toward it, and it opens questions rather than shutting them.","That’s not my view. Faith and reason meet constantly — reason can climb partway toward what faith completes."]},{say:"I also taught something called natural law. What did I mean by it?",o:["Moral truths built into human nature that reason itself can discover","Whatever laws happen to be written down by kings and legislators","A separate law that only applies to the natural world, like animals and plants","Church commandments handed down for the faithful to obey without question"],w:"Look closely at human nature itself, and reason can find real moral truths there — truths no ruler invented and no ruler can simply cancel.",fb:["A king’s decree isn’t automatically that. It can fall short of it, or violate it outright.","It isn’t limited to plants and animals. It lives in being human at all, something anyone can work out by thinking clearly.","It doesn’t ask you to switch your mind off. It asks you to use it to find deeper truths."]},{t:"s",say:"A friend says, ‘I can’t scientifically prove kindness matters, so it must not really matter.’ What would I tell them?",o:["Reason can discover moral truths, like kindness mattering, the same way it discovers other truths","They’re right, since only things you can measure in a laboratory really count as true","Faith alone decides questions like that, so reason has nothing useful left to add here","Kindness only really matters if it happens to make you feel happy in the end"],w:"A microscope was never going to be the right tool for this question. Reason reaches further than the laboratory, into what makes a life good.",fb:["A laboratory measures one slice of reality. There’s more to find than what a scale or a lens can weigh.","It isn’t sidelined here. It’s exactly the tool suited to finding this kind of truth.","Kindness matters whether or not it pays you back in happiness. It answers to something in our nature, not to a passing mood."]}],reflect:"Where could your deepest convictions and your reasoning work together instead of apart?",bye:"Go in peace, Wanderer, and let your reason and your faith walk the same road a while longer.",back:"Back at the cathedral? Good. There’s always another question reason and faith can share."},
 kant:{intro:["Come in, take any seat — I take the same one myself, every day, at the same hour. My neighbors, they say, set their clocks by my afternoon walk.","I once thought knowledge alone gave a person worth, and I looked down on people who had none. Reading Rousseau set me right. I learned to respect every human being.","Let’s talk about the one test I trusted more than any result."],q:[{say:"I built what’s called the categorical imperative. What’s the basic test it asks?",o:["Whether you could will that everyone act on the same rule you’re about to follow","Whether the action happens to make you personally happy in that moment","Whether most of the people around you already happen to act the very same way","Whether the action would end up doing more real good than harm for everyone involved"],w:"Before I act, I ask whether I could want that exact rule to hold for absolutely everyone, no exceptions. If I couldn’t, the rule breaks under its own weight.",fb:["Your own happiness isn’t the test here. A rule has to hold for everyone, whether or not it pleases you.","What most people do proves nothing. A rule can be common and still fail the test.","That’s Mill’s test, weighing outcomes. Mine asks whether the rule itself could hold for everyone, regardless of result."]},{say:"I also said to treat people always as ends, never merely as means. What did I mean?",o:["Never use another person purely as a tool for your own purposes","Avoid asking other people for help, since that uses them as a means","Save your real respect for people you personally find useful","The ends justify the means, so a good goal excuses how you get there"],w:"Asking for help isn’t the problem; using someone as nothing but a tool, with no regard for their own reasons and goals, is. Their choices matter too.",fb:["Asking for help is fine, so long as you respect their own reasons for helping. That’s not what I warned against.","Respect isn’t earned by usefulness. Every person qualifies, useful to you or not.","That’s the opposite of my view. A good end never excuses treating someone as a mere tool along the way."]},{t:"s",say:"A manager tells a struggling employee a comforting lie to keep them working hard, ‘for their own good.’ What would I say?",o:["Could the manager will that everyone lie whenever it’s convenient? If not, the lie fails the test","It’s fine, since the overall outcome for the company is really what matters most","It’s fine, since the employee will most likely never even find out about it","Could the lie hurt the employee later? If it might, it’s wrong; if it can’t, it’s allowed"],w:"Ask the manager’s own rule to hold everywhere: would they want lying-for-convenience to become how everyone treats everyone? They wouldn’t — so the exception they’re making for themselves doesn’t hold.",fb:["That’s Mill’s kind of reasoning, weighing the outcome. My test asks about the rule itself, not just its results.","Whether they’re caught was never the question. The rule fails or holds on its own, regardless of discovery.","I don’t measure the hurt at all. The lie fails the test the moment it makes an exception for itself, hurt or not."]}],reflect:"Is there a rule you’d bend for yourself that you’d never want everyone to bend?",bye:"Go on your way, same time as always, Wanderer. Test your next rule before you lean on it.",back:"Back already? Good — punctuality is its own kind of virtue."},
 mill:{intro:["Come in from the cold, Wanderer. My father had me reading Greek before I was four, and a warm library still feels like a small mercy.","At twenty, right after mastering every argument I’d been taught, I fell into a strange kind of despair. A poet, not an argument, is what pulled me back out.","Let’s talk about what actually makes a life, or a choice, good."],q:[{say:"I argued for the greatest happiness principle. What does it actually ask of you?",o:["Choose whatever produces the most overall happiness and the least suffering for everyone affected","Choose whatever makes you personally the very happiest, regardless of anyone else","Choose whatever a strict rule says, whatever the actual outcome turns out to be","Choose whatever your gut instinct happens to say in the moment, without weighing anyone else’s outcome at all"],w:"It isn’t about your own happiness alone. Weigh everyone your choice touches, and favor whichever option leaves the most happiness and the least suffering overall.",fb:["Only your own happiness leaves everyone else out of the sum. Weigh their happiness too.","That’s closer to Kant’s approach, testing the rule itself. I weigh the actual outcome for everyone involved.","Instinct alone skips the weighing. I want you totaling up real consequences, not just a feeling."]},{say:"I also said some pleasures are higher than others. What did I mean by that?",o:["A thoughtful, engaged life is worth more than one spent purely on simple bodily pleasure","Expensive pleasures will generally count for a good deal more than cheaper ones ever do, in the end","Pleasures differ only in how intense they are and how long they last","Only pleasures enjoyed in complete solitude and quiet count as truly higher"],w:"Better to be dissatisfied and thinking than satisfied and unreflective. Pleasures like knowledge and friendship engage more of what makes us human than simple bodily comfort does.",fb:["Price was never my measure. A cheap evening with good friends can outrank an expensive, empty one.","That’s Jeremy Bentham’s measure, not mine. I ranked pleasures by kind, not just by amount.","Solitude isn’t the requirement. Friendship and shared learning rank as high as anything quiet and alone."]},{t:"s",say:"A city wants to ban a book because most residents find its ideas offensive. What would I say?",o:["Being offended isn’t harm; liberty should only be limited to prevent real harm to others","Ban it right away, since the comfort of the majority plainly outweighs the rights of one small book","Ideas aren’t harmless; a city may ban any book that could lead readers toward bad choices","Let each individual reader decide for the whole city, whatever they personally prefer"],w:"Offense to feelings isn’t the same as harm. My harm principle limits liberty only to stop real injury to others, and a book that merely offends doesn’t cross that line.",fb:["Majority discomfort isn’t harm either. My principle protects against real injury, not against mere offense.","A book can’t injure anyone by itself. My principle steps in for real injury to others, not for what an idea might inspire.","One reader can’t decide for an entire city either way. The book’s place is protected for everyone, not by a single vote."]}],reflect:"Whose happiness does a choice you’re facing affect, including people you’ll never meet?",bye:"Go on, and count the happiness your next choice creates, not just your own.",back:"Back in the library? Good. There’s always another sum worth totaling."},
 gilligan:{intro:["Welcome to the courtyard, Wanderer. Every lantern here is tied by thread to another home — pull one gently, and you’ll feel the others shift.","I’m called the Weaver. I don’t speak for myself so much as for something Carol Gilligan noticed, and I’d like to pass it along.","Let’s talk about a voice a lot of older theories almost missed."],q:[{say:"Carol Gilligan studied how people actually reason through hard choices. What did she notice that older theories, built mostly from studies of boys, had missed?",o:["A voice that reasons through relationships and care for real people, not just abstract rules","That women are simply, inherently less capable of careful moral reasoning than men","A voice guided by loyalty to the people close to us, not the careful reasoning fairness demands","That everyone eventually reasons the same way, given enough time"],w:"She heard people, often women, reasoning through relationships and responsibility rather than abstract rules alone. The older theories had scored that voice as somehow less developed, when it was simply different.",fb:["Gilligan argued against ranking it as lesser capability. She heard a different, equally serious way of reasoning, not a weaker one.","This voice isn’t a lapse in careful thinking. It’s serious moral reasoning that keeps care and fairness side by side.","She found real differences in how people reasoned, not one identical pattern. That’s exactly what the old stages had flattened out."]},{say:"In one interview, an eleven-year-old named Amy was asked whether a man should steal a medicine he couldn’t afford, to save his wife. She kept looking for ways to talk with the druggist instead. What did Carol Gilligan hear in that?",o:["A way of reasoning that tries to keep everyone connected, not a failure to see the rules","Confusion about the rules themselves, which the older, more traditional scale scored as less mature thinking","A clever way to dodge a hard question that has only two real answers","A kind-hearted instinct, not a real answer to the moral question she was asked"],w:"Where the older scale saw confusion, Gilligan heard a different logic. Amy saw a web of relationships and looked for a way to keep everyone in it, instead of ranking a rule against a life.",fb:["That’s how the older scale scored her. Gilligan’s point was that it misheard her.","Amy wasn’t dodging. She was reworking the question so no one would be cut off.","It was a serious answer, not a soft one. She was reasoning about how to keep everyone in the picture."]},{t:"s",say:"A team debates a hard call using only cold cost-benefit math, ignoring how it affects the people involved. What might this voice add?",o:["Ask who depends on this decision, and what their actual needs and relationships are","Numbers are really the main thing that matters in any decision","Set the numbers aside entirely and decide using feelings alone, without a second thought","Whoever has the most formal authority should simply decide alone, unquestioned"],w:"This voice doesn’t throw out the math. It adds a question the math alone can’t answer: who is affected, what do they actually need, and what does this decision do to the relationships involved?",fb:["This voice doesn’t dismiss the numbers either. It just refuses to let them be the whole conversation.","It isn’t feelings instead of thinking. It’s care and relationship added to the reasoning, not a replacement for it.","Authority alone answers nothing about who’s affected. This voice asks that question regardless of who’s deciding."]}],reflect:"Who depends on you right now, and how are you caring for that relationship?",bye:"Go gently, Wanderer. Notice one thread today, and mind how it pulls.",back:"Back in the courtyard? Good. There’s always another thread worth noticing."}
};
const ARTI={
 kierkegaard:{hint:"Before we talk, look around. I left a few things here that say more about me than I could.",items:[
  {g:"leap",n:"The Returned Ring",k:"ring",dx:3,dy:-3,text:["An engagement ring, sent back unworn.","In 1841, Kierkegaard broke off his engagement to Regine Olsen, the woman he loved. His reasons are still debated, but he seems to have believed his calling demanded total commitment to God and to his writing. He wrestled with that choice for the rest of his life.","He called the feeling such choices bring ‘anxiety’: the dizziness of freedom, staring into everything you could become."]},
  {g:"voices",n:"Books Signed with False Names",k:"book",dx:-12,dy:4,text:["A stack of books by ‘Johannes de Silentio,’ ‘Victor Eremita,’ and others. They are all Kierkegaard.","He wrote under false names so each voice could show a different way to live: one chasing pleasure, one committed to duty, and one standing in awe of faith, the deepest way of all.","He wanted readers to choose for themselves, not just follow him."]},
  {g:"crowd",n:"The Cracked Church Bell",k:"bell",dx:-9,dy:3,text:["A bell from a Copenhagen church, split down one side.","In his final year, Kierkegaard publicly attacked the Church of Denmark. He wasn’t rejecting Christianity. He believed the official church had turned faith into a comfortable custom people inherited, instead of a passionate personal commitment."]}]},
 nietzsche:{hint:"Talk? First, look. The mountain keeps a few of my things. Find them.",items:[
  {g:"idols",n:"A Stone Hammer",k:"hammer",dx:3,dy:1,text:["Nietzsche wrote of doing philosophy ‘with a hammer’: tapping old ideas to hear which ones ring hollow.","The son and grandson of Lutheran pastors, he concluded that Europe’s shared faith was fading, and that people hadn’t yet faced what that would mean for everything built on it."]},
  {g:"tornpage",n:"A Torn Page",k:"page",dx:-3,dy:4,text:["The page reads: “God is dead.”","Nietzsche meant it as a warning, not a celebration. When a culture stops believing, the values resting on that belief begin to wobble. The danger is nihilism, the sense that nothing matters.","His answer was to create values worth living by, and to say yes to life."]},
  {g:"oncemore",n:"An Eagle Feather",k:"feather",dx:-1,dy:-1,text:["In Thus Spoke Zarathustra, an eagle and a serpent keep the prophet company, and they hail him as the teacher of eternal recurrence.","Nietzsche first posed that idea as a test in The Gay Science: imagine living your exact life again, every joy and every pain, over and over forever. Could you welcome it?","He called loving your life that completely amor fati, love of fate."]}]},
 camus:{hint:"Before we talk, look around. The hillside has a few stories to tell.",items:[
  {g:"absurd",n:"A Weathered Notebook",k:"book",dx:-11,dy:0,text:["Camus grew up poor in French Algeria and never forgot the sun and sea of his youth.","In his notebooks he sketched the idea he later built into The Myth of Sisyphus (1942), ‘the absurd’: the clash between our hunger for meaning and a universe that stays silent. The absurd isn’t in us or the world alone. It lives where the two meet."]},
  {g:"sisyphus",n:"A Chip of the Boulder",k:"stone",dx:3,dy:0,text:["In Greek myth, Sisyphus is condemned to push a boulder uphill forever, only to watch it roll back down.","Camus flips the story. Sisyphus knows his fate exactly and keeps pushing anyway. By owning the struggle, he masters it. Camus ends his essay by asking us to picture Sisyphus happy."]},
  {g:"goalkeeper",n:"A Goalkeeper’s Glove",k:"glove",dx:-9,dy:-5,text:["As a young man, Camus played goalkeeper, and he later said sport taught him much of what he knew about ethics.","He rejected two escapes from the absurd: despair, and the ‘leap’ into a faith that hands you ready-made meaning. His way was revolt: live fully and honestly, even without final answers."]}]},
 sartre:{hint:"We’ll talk soon. First, look around the hall. What you find is yours to interpret.",items:[
  {g:"excuses",n:"A Café Waiter’s Tray",k:"tray",dx:5,dy:0,text:["Sartre described a café waiter whose every move is a little too perfect, as if he were playing ‘waiter’ instead of being a person.","He called this bad faith: pretending you’re a fixed thing with no choice, when you are actually free."]},
  {g:"doors",n:"Round Spectacles",k:"glasses",dx:-3,dy:3,text:["Sartre’s thick round glasses were famous. So was his atheism.","His line ‘existence precedes essence’ means there is no blueprint for being human. You show up first, then define yourself by what you choose to do."]},
  {g:"medal",n:"A Refused Medal",k:"medal",dx:3,dy:3,text:["In 1964, Sartre was awarded the Nobel Prize in Literature, and he turned it down, saying a writer shouldn’t let himself be turned into an institution.","For Sartre, even under pressure, we always choose, and we are responsible for what we choose. ‘I had no choice’ is usually an excuse."]}]},
 beauvoir:{hint:"You want to talk? Then look around first. These cages have stories in them.",items:[
  {g:"becoming",n:"A Worn Copy of The Second Sex",k:"book",dx:0,dy:5,text:["Published in 1949, de Beauvoir’s book argued that much of what society calls ‘natural’ for women is actually taught, shaped by upbringing and expectation rather than biology alone.","It became a founding work of modern feminism."]},
  {g:"cages",n:"A Ring of Cage Keys",k:"key",dx:4,dy:2,text:["In The Ethics of Ambiguity, de Beauvoir argued that freedom is never a solo project.","We are only truly free in a world where others are free too. Using people as stepping stones undercuts the very freedom we claim for ourselves."]},
  {g:"rosary",n:"A Rosary, Set Aside",k:"beads",dx:-4,dy:1,text:["Raised a devout Catholic, de Beauvoir lost her faith at around fourteen.","She built her ethics on human freedom and responsibility rather than divine law. She was Sartre’s lifelong partner and sharpest critic, and her ideas were very much her own."]}]},
 frankl:{hint:"Please, look around before we speak. Each of these things kept me going once.",items:[
  {n:"Pages of a Lost Manuscript",k:"scroll",dx:-3,dy:0,text:["When Frankl was taken to the Nazi camps, the manuscript of his first book was taken from him.","He kept himself going partly by rebuilding it in his mind and scribbling notes on scraps of paper. Having work still to finish gave him a reason to endure."]},
  {n:"A Prisoner’s Tin Cup",k:"cup",dx:4,dy:3,text:["Frankl noticed that even in the camps, some prisoners gave away their last piece of bread.","Everything can be taken from a person, he wrote, except the freedom to choose one’s attitude. Meaning comes from three places: what we create, whom and what we love, and how we face suffering we can’t avoid."]},
  {n:"A Doctor’s Letter",k:"letter",dx:-5,dy:-4,text:["A letter signed ‘Dr. V. Frankl.’","He called his approach logotherapy, from the Greek logos, meaning. Freud said we’re driven mainly by pleasure and Adler by power. Frankl said our deepest drive is the will to meaning."]}]},
 fromm:{hint:"Before we talk, wander the garden a little. Notice what you find.",items:[
  {n:"A Spilled Purse of Coins",k:"medal",dx:-1,dy:-1,text:["Fromm saw two ways to live.","In the having mode, we define ourselves by what we own and control. In the being mode, we find ourselves in what we do, share, and experience. Modern life, he warned, pushes us hard toward having."]},
  {g:"rose",n:"A Well-Tended Rose",k:"rose",dx:-6,dy:3,text:["In The Art of Loving, Fromm argued that love isn’t something you simply fall into.","It’s an art you practice, like music or carpentry, built on care, responsibility, respect, and knowledge."]},
  {g:"zenletter",n:"A Letter from a Zen Teacher",k:"letter",dx:2,dy:5,text:["Raised in an Orthodox Jewish family, Fromm later called himself a ‘non-theist.’","He still drew deeply on the Hebrew prophets and on Zen Buddhism, and he co-wrote a book with the Zen teacher D. T. Suzuki."]}]},
 /* ---- Level II: the Marble Coast ---- */
socrates:{hint:"Before we talk, look at what I’ve kept near me. Even a philosopher owns a few things.",items:[{g:"hemlock",n:"A Cup of Hemlock",k:"cup",dx:2,dy:-1,text:["An empty cup, still smelling faintly bitter.","In 399 BC, an Athenian jury convicted Socrates of impiety and corrupting the young, and sentenced him to death by drinking hemlock.","He accepted the sentence rather than flee into exile, arguing that a citizen who benefits from a city’s laws owes them obedience even when a verdict feels unjust."]},{g:"cloak",n:"A Frayed Cloak",k:"cloak",dx:-9,dy:3,text:["A rough, much-mended cloak, worn thin at the shoulders.","Socrates famously went barefoot and wore the same plain cloak through every season, unbothered by wealth or appearance, which he considered beside the point of a good life."]},{g:"gadfly",n:"The Gadfly",k:"fly",dx:7,dy:4,text:["A small carved fly, wings spread.","At his trial, Socrates compared himself to a gadfly stinging a sluggish, noble horse, Athens itself, to keep it awake and honest. The city, he said, would be poorer for killing him."]}]},
 aristotle:{hint:"Before we talk, look around the colonnade. I keep a few things close at hand.",items:[{g:"mean",n:"A Scroll of the Nicomachean Ethics",k:"scroll",dx:4,dy:1,text:["A well-worn scroll, titled for his son Nicomachus, who may have edited it after Aristotle’s death.","In it, Aristotle argues the good life isn’t a feeling but a whole life lived and acted well: eudaimonia, flourishing, built through habits of character."]},{g:"waxtablet",n:"A Tutor’s Wax Tablet",k:"tablet",dx:-3,dy:6,text:["A wax tablet, scratched with a young hand’s practice letters.","Aristotle tutored the teenage son of King Philip II of Macedon for several years at Mieza, a student who later conquered an empire and is remembered as Alexander the Great."]},{g:"peripatos",n:"A Walking-Path Marker",k:"stone",dx:1,dy:8,text:["A worn stone marking a covered walkway.","Aristotle’s school, the Lyceum, earned the nickname ‘peripatetic,’ from the Greek for walking about, since he taught while pacing its colonnade with students beside him."]}]},
 epicurus:{hint:"Before we talk, wander the garden. A few things here explain me better than I can.",items:[{g:"garden",n:"Bread and a Cup of Water",k:"cup",dx:-1,dy:-5,text:["A crust of bread and a plain cup of water, his usual meal.","Epicurus taught that natural, necessary pleasures, like plain food and shelter, satisfy us completely. Chasing luxury only invites new worries."]},{g:"gate",n:"The Garden’s Gate",k:"gate",dx:-2,dy:1,text:["A gate to a walled garden just outside Athens, where Epicurus founded his school.","Unusually for the time, the Garden welcomed women and enslaved people as students alongside citizens, valuing friendship over status."]},{g:"cure",n:"A Tablet of the Four-Part Cure",k:"tablet",dx:8,dy:3,text:["A small tablet listing four short lines, later called the tetrapharmakos, ‘four-part remedy.’","Don’t fear god. Don’t worry about death. What is good is easy to get. What is terrible is easy to endure. Epicurus meant it as medicine for an anxious mind."]}]},
 seneca:{hint:"Before we talk, look through my study. An advisor to an emperor keeps strange souvenirs.",items:[{g:"thieves",n:"A Cracked Hourglass",k:"hourglass",dx:-4,dy:2,text:["An hourglass, its glass split down one side, sand still slowly falling.","In On the Shortness of Life, Seneca argued that life isn’t short. We make it short, squandering hours we could spend on what actually matters."]},{g:"letters",n:"A Bundle of Letters",k:"letter",dx:5,dy:1,text:["Letters addressed to a friend, Lucilius, on everything from grief to the proper use of time.","Seneca’s Letters to Lucilius mix Stoic philosophy with everyday advice, written as if coaching a friend through an ordinary life."]},{g:"sealring",n:"A Statesman’s Ring",k:"ring",dx:-10,dy:0,text:["A signet ring, the mark of a Roman senator and advisor.","Seneca tutored, then advised, the young emperor Nero. Their relationship soured badly, and in AD 65, Nero ordered him to take his own life. Seneca is said to have met the end with the same composure he’d spent his life writing about."]}]},
 epictetus:{hint:"Before we talk, look around the school. What’s here is plainer than you’d expect.",items:[{g:"chain",n:"A Broken Chain",k:"chain",dx:3,dy:1,text:["A rusted iron chain, snapped at one link.","Epictetus was born enslaved in Hierapolis, in Roman Asia Minor, and was later freed. He built a philosophy less concerned with legal status than with the freedom of the mind."]},{g:"yours",n:"A Clay Lamp",k:"lamp",dx:3,dy:5,text:["A plain clay lamp, standing in for a costlier one.","After Epictetus’s iron lamp was stolen, he replaced it with a cheap clay one and didn’t trouble himself over the loss. After his death, admirers reportedly paid huge sums for that lamp, missing his point entirely."]},{g:"crutch",n:"A Wooden Crutch",k:"crutch",dx:-10,dy:-3,text:["A simple wooden crutch, worn smooth at the grip.","Epictetus was lame, by some accounts from a leg broken as a slave. He taught that the body could be crippled or bound without touching what’s truly his: his own judgments and will."]}]},
 marcus:{hint:"Before we talk, look through the camp. A few things travel with me on campaign.",items:[{g:"morning",n:"A Private Notebook",k:"scroll",dx:2,dy:2,text:["A worn notebook, titled in Greek Ta eis heauton, ‘To Himself.’","Marcus wrote these private reflections while on military campaign along the Danube frontier, never intending them for anyone else. We call the collection Meditations."]},{g:"above",n:"An Emperor’s Laurel",k:"laurel",dx:-12,dy:0,text:["A bronze laurel wreath, tarnished from the weather.","Marcus ruled Rome at its height, yet wrote often about staying humble, patient, and unimpressed by his own power. He treated the crown as a duty, not a prize."]},{g:"danube",n:"A River Stone from the Danube",k:"riverstone",dx:-13,dy:7,text:["A smooth stone, picked up along a cold riverbank.","Much of Meditations was written during the Marcomannic Wars, fought along the Danube frontier. Even mid-campaign, Marcus kept returning to the same question: how should a person act, whatever comes?"]}]},
 buddha:{hint:"Before we talk, look around the tree. A few things sit here that explain me better than words do.",items:[{g:"bodhi",n:"A Bodhi Leaf",k:"leaf",dx:-9,dy:-3,text:["A single heart-shaped leaf, fallen from the tree overhead.","At Bodh Gaya, the Buddha is said to have awakened while sitting beneath a Bodhi tree, after years of searching through both luxury and harsh self-denial."]},{g:"alms",n:"An Alms Bowl",k:"bowl",dx:3,dy:4,text:["A plain wooden bowl, its rim worn smooth.","Buddhist monks traditionally carry an alms bowl and live on whatever food is offered to them, a daily practice in simplicity and non-attachment."]},{g:"lute",n:"A Carved Wheel",k:"wheel",dx:-3,dy:-4,text:["A small stone wheel, its spokes carved in a circle.","At Sarnath, the Buddha gave his first teaching after his awakening. Tradition calls it ‘turning the wheel of the teaching,’ the Dharmachakra."]}]},
 laozi:{hint:"Before we talk, look near the gate. A few things here say more than I ever managed to write down.",items:[{g:"slips",n:"Bamboo Slips of the Daodejing",k:"slips",dx:4,dy:2,text:["A bundle of bamboo strips, bound with cord and inked with characters.","Legend holds that Laozi wrote the Daodejing at the request of a gatekeeper, before riding west and vanishing from history."]},{g:"water",n:"A River Stone, Worn Smooth",k:"riverstone",dx:-8,dy:-4,text:["A pale stone, rounded by years of moving water.","Laozi pointed to water again and again: soft, yielding, and yet strong enough to wear down anything in its path."]},{g:"buffalo",n:"A Water Buffalo’s Bell",k:"bell",dx:6,dy:5,text:["A small bronze bell, its clapper worn quiet.","The story goes that Laozi, weary of a crumbling court, rode west out of China on a water buffalo and was never seen again."]}]},
 zhuangzi:{hint:"Before we talk, look up into the branches. A few things here explain me better than any argument could.",items:[{g:"butterfly",n:"A Butterfly",k:"butterfly",dx:-6,dy:-5,text:["A butterfly, resting on a low branch, wings folded.","Zhuangzi once dreamed he was a butterfly, and woke unsure whether he was a man who had dreamed of being one, or a butterfly now dreaming he was a man."]},{g:"ding",n:"Cook Ding’s Knife",k:"knife",dx:5,dy:3,text:["A thin, well-worn blade, its edge still keen.","In one of Zhuangzi’s stories, a cook named Ding used the same knife for nineteen years without dulling it, by following the natural openings in what he cut rather than forcing his way through."]},{g:"claypot",n:"A Clay Pot, Drummed Smooth",k:"pot",dx:-2,dy:6,text:["A simple clay pot, its rim scuffed from tapping.","After his wife died, Zhuangzi is said to have drummed on a pot and sung, seeing her death as simply one more turn of nature’s constant change."]}]},
 confucius:{hint:"Before we talk, look around the hall. A few things here say more about a good life than any single lecture.",items:[{g:"analects",n:"The Analects",k:"scroll",dx:-10,dy:2,text:["A bound collection of sayings and conversations.","Confucius wrote little himself. The Analects were compiled after his death by his students, from what they remembered him saying."]},{g:"zither",n:"A Zither",k:"zither",dx:4,dy:-3,text:["A long wooden instrument, strings still faintly humming.","Confucius loved music deeply, and considered it, alongside ritual, one of the arts that shaped a person’s character."]},{g:"shared",n:"An Ancestral Tablet",k:"ancestral",dx:-2,dy:6,text:["A small wooden tablet, inscribed with a family name.","Confucius taught deep respect for parents, elders, and ancestors, seen as the roots that a person’s whole character grows from."]}]},
 dogen:{hint:"Before we talk, look around the temple. A few things here explain the practice better than I can.",items:[{g:"sitting",n:"A Meditation Cushion",k:"cushion",dx:2,dy:4,text:["A round cushion, flattened from long use.","Dōgen taught shikantaza, ‘just sitting’: meditation practiced for its own sake, not as a means to some later reward."]},{g:"kitchen",n:"A Cook’s Ladle and Drying Mushrooms",k:"ladle",dx:-8,dy:-2,text:["A wooden ladle, beside a tray of mushrooms laid out to dry.","On his journey to China, Dōgen once questioned an old temple cook about wasting a hot day drying mushrooms himself. The cook’s answer, in effect, ‘if not now, when,’ stayed with him for the rest of his life."]},{g:"sandal",n:"A Straw Sandal",k:"sandal",dx:5,dy:5,text:["A worn straw sandal, from a long journey.","Dōgen sailed to China in 1223 to study Zen, and returned to Japan in 1227 to found the Sōtō school."]}]},
 aquinas:{hint:"Before we talk, look around the forecourt. A few things here explain me better than any argument could.",items:[{g:"summa",n:"His Unfinished Summa",k:"book",dx:9,dy:-3,text:["An open book beside a lantern, its final pages blank.","After an unusually long ecstasy while celebrating Mass in December 1273, Aquinas is said to have told his secretary, Reginald of Piperno, ‘I cannot, because all that I have written seems like straw to me.’ He never returned to the Summa Theologiae, and it remains unfinished."]},{g:"ox",n:"A Small Stone Ox",k:"ox",dx:13,dy:1,text:["A small carved ox, worn smooth at the horns.","As a quiet, heavyset student, Aquinas was mocked by classmates as ‘the dumb ox.’ His teacher, Albert the Great, is said to have answered: this ox’s bellowing will one day be heard throughout the world."]},{n:"Three Lit Candles",k:"candles",dx:-2,dy:3,g:"lights",text:["Three candles burning steadily in a row.","Aquinas wrote of the theological virtues — faith, hope, and love — given by grace, standing alongside the four virtues reason can build on its own: prudence, justice, courage, and moderation."]}]},
 kant:{hint:"Before we talk, look around the hall. A few things here explain a life kept as regular as a clock.",items:[{g:"kantwalk",n:"A Pocket Watch",k:"watch",dx:-9,dy:-5,text:["A plain silver watch, still keeping time.","The story goes that Kant’s neighbors in Königsberg set their own clocks by his daily afternoon walk, so precisely timed it became local legend."]},{g:"rule",n:"A Star Chart",k:"starchart",dx:-16,dy:-3,text:["A chart of the night sky, carefully inked.","Near the end of the Critique of Practical Reason, Kant names two things that fill him with wonder: ‘the starry heavens above me and the moral law within me.’ The line now hangs on a plaque beside his tomb in Königsberg."]},{g:"citymap",n:"A Well-Worn Map of Königsberg",k:"map",dx:-4,dy:2,text:["A small map, its edges soft from handling.","Kant rarely traveled far from his hometown of Königsberg his entire life, teaching and writing there until his death in 1804."]}]},
 mill:{hint:"Before we talk, look along the shelves. A few things here explain more of me than any single argument could.",items:[{n:"A Copy of On Liberty",k:"book",dx:9,dy:-3,g:"corner",text:["A slim, well-thumbed volume.","Published in 1859, it argues for the harm principle: the only justification for limiting someone’s liberty is to prevent real harm to others."]},{g:"poems",n:"Wordsworth’s Poems",k:"poems",dx:16,dy:1,text:["A worn volume of poetry, its spine cracked from use.","At twenty, Mill fell into a mental crisis after a childhood of relentless, purely intellectual education. He credited Wordsworth’s poetry with helping him recover a sense of feeling, not just argument."]},{g:"petition",n:"A Women’s Suffrage Petition",k:"petition",dx:5,dy:3,text:["A long scroll of signatures, tied with ribbon.","In 1866, Mill presented Parliament with the first large women’s suffrage petition, and in 1869 published The Subjection of Women, shaped together with Harriet Taylor Mill."]}]},
 gilligan:{hint:"Before we talk, look at what hangs between the lanterns. A few things here say more than any one argument could.",items:[{g:"different",n:"A Copy of In a Different Voice",k:"book",dx:-6,dy:1,text:["A well-read paperback, its cover soft with age.","Published in 1982, Carol Gilligan’s book argued that moral psychology had been built mostly from studying boys and men, and that it had misheard a real, different voice as a lesser one."]},{n:"A Spool of Glowing Thread",k:"thread",dx:7,dy:-2,g:"web",text:["A spool of fine thread, faintly luminous.","Every lantern in this courtyard is strung to another by a fine thread. Pull on one gently, and see how far the tug travels."]},{g:"tellmore",n:"A Notebook of Interviews",k:"notebook",dx:0,dy:3,text:["A notebook filled with careful, quoted handwriting.","Gilligan’s research grew out of listening closely to how real people, girls and women especially, talked through their own hard choices."]}]}

const AFFIRM=["Yes. Exactly.","That’s it.","You see it clearly.","Well said.","Just so."];
const VOID_TALK={intro:["The air turns cold. The rain stops falling and simply hangs there.","A voice rises from the dark, from everywhere at once: “Why walk at all, little lantern? Nothing you learned will matter.”","Answer it with what the thinkers taught you."],
 hit:["Your lantern flares. The Void recoils.","Light spills across the plain. The Void shrinks back.","The swirl falters. Your lantern burns brighter.","The Void hisses and gives ground.","Cracks of gold split the dark."],
 miss:"The Void laughs, and your lantern flickers. But the memory is still there.",
 bye:"The Void unravels into drifting violet sparks. Where it stood, something warm and golden rises from the ground."};
const VOID_CHALLENGES=[
 {p:"kierkegaard",taunt:"You only believe what everyone around you believes. You have never chosen anything for yourself.",
  w:"Faith and self have to be chosen personally — never just inherited from the crowd."},
 {p:"nietzsche",taunt:"Nothing you do will outlast you. In the end, none of it will have mattered.",
  w:"What outlasts you was never the point. The measure is whether you could want this life again, exactly as it is."},
 {p:"camus",taunt:"Your work will never mean anything to the universe. Why lift a finger?",
  w:"The universe was never going to answer. Living it fully, anyway, is the rebellion."},
 {p:"sartre",taunt:"You had no choice. No one ever really does.",
  w:"There’s always a choice, even when everything around you insists there isn’t."},
 {p:"beauvoir",taunt:"Your freedom is yours alone. What happens to everyone else is none of your concern.",
  w:"No one is free while working against someone else’s freedom. It’s shared, or it’s incomplete."},
 {p:"frankl",taunt:"Your suffering serves nothing. It simply is, and then it ends you.",
  w:"Suffering you can’t escape can still hold meaning, in how you choose to face it."},
 {p:"fromm",taunt:"What you own is the only proof your life adds up to anything at all.",
  w:"What you own was never the measure. What you do, share, and become is."}
];
/* Level II boss: Fortune and her wheel */
const FORTUNE_TALK={intro:["The sea goes still. Then the wind turns, and a great bronze wheel rises out of the storm clouds.","“Kings, beggars, all the same to me. I lift you up and throw you down. What could you possibly control?”","Answer her with what the thinkers taught you."],hit:["The wheel groans and slows. Fortune scowls.","Gold light cracks along the wheel’s rim. Fortune recoils.","The storm dims for a moment. Fortune’s grip falters.","The wheel shudders, and Fortune hisses through her teeth.","Light spreads across the headland. Fortune gives ground."],miss:"Fortune laughs, and the wheel lurches. But what you learned is still yours.",bye:"The wheel locks in place and the storm parts. Where Fortune stood, a small golden fortress shines, calm as the sea."};
const FORTUNE_CHALLENGES=[{p:"socrates",taunt:"Wealth and fame are what make a life worth living, and I hand them out.",w:"Care for your soul before money or reputation. That was always the harder, truer wealth."},{p:"aristotle",taunt:"Character is luck. Some are born good, and some aren’t.",w:"Character is built by practice, not luck. We become brave by doing brave things, again and again."},{p:"epicurus",taunt:"Without riches and luxury, you’ll never be happy.",w:"Happiness is simpler than riches: friends, enough bread, and a mind free of needless fear."},{p:"seneca",taunt:"Your days slip through my fingers. You’ll run out of time before you ever live.",w:"Life is long enough for those who guard it well. The hours you spend wisely were never yours to lose to me."},{p:"epictetus",taunt:"Your plans, your health, your name: all mine to take. Nothing is up to you.",w:"Events belong to you, Fortune. My judgments and choices never did."},{p:"marcus",taunt:"Everything you love, I can take away.",w:"All things change; that’s nature, not cruelty. I’ll love them fully anyway, and do my part while I can."}];
const GRASPING_TALK={intro:["The mist thickens and begins to whisper. On the mountain, something vast and hollow stirs: arms reaching, a belly that is never full.","“More. Always more. What are you, without more?”","Answer it with what the thinkers taught you."],hit:["The Grasping Mind’s reaching arms falter. Its hollow belly groans.","Fireflies spark where its grip loosens. It snatches at the mist instead.","The shrine’s lanterns brighten. The Grasping Mind recoils.","Its many arms curl inward, empty-handed. Its tiny mouth hisses.","Light spreads across the mountain shrine. The Grasping Mind gives ground."],miss:"The Grasping Mind snatches at your lantern light. But what you learned is still yours.",bye:"Its arms fall open. Everything it clutched drifts away as fireflies, and where it stood, a plain wooden block glows softly on a mossy stone."};
const GRASPING_CHALLENGES=[{p:"buddha",taunt:"One more thing and you’ll finally be happy. Then one more after that.",w:"Craving never ends by feeding it. Seeing it clearly is where freedom starts."},{p:"buddha",taunt:"Hold on tight. Everything you love must stay exactly as it is.",w:"Everything changes. Clinging to what can’t last is what makes the loss hurt so much."},{p:"laozi",taunt:"Force it. Push harder. Control every outcome.",w:"Water wins by yielding. Act without forcing, and things move."},{p:"laozi",taunt:"Carve yourself into something impressive, whatever it takes.",w:"The uncarved block holds every shape. Simplicity is strength, not lack."},{p:"zhuangzi",taunt:"If you’re not useful, you’re worthless.",w:"The twisted tree no carpenter wanted lived for centuries. Uselessness has its gifts."},{p:"confucius",taunt:"Manners are empty. Treat people however you like.",w:"Courtesy is how care shows. Don’t do to others what you wouldn’t want done to you."},{p:"dogen",taunt:"Awakening is somewhere else, later, once you’ve gotten more.",w:"Practice is awakening. It’s here, in sitting, in cooking, in this moment."}];
/* Level IV boss: the Dilemma Engine at the junction */
const ENGINE_TALK={intro:["Steam hisses across the junction. Gears the size of houses grind, and furnace eyes open above a lever where the tracks split into fog.","“Every choice is a trap. Pull the lever or don’t, and someone loses. Why pretend there’s a right answer?”","Answer it with what the thinkers taught you."],hit:["The Dilemma Engine’s gears catch and grind. Steam hisses from a cracked valve.","The lever at the crossroads trembles. Its furnace eyes flicker.","One of its scales tips level. The tracks beneath it groan and slow.","Brass plating buckles inward. Its grip on the lever loosens.","Fog rolls back from the junction. Its furnace dims by a degree."],miss:"The Engine lurches and the fog thickens. But what you learned is still yours.",bye:"Three beams of light strike the Engine at once. Its gears slow, stop, and fall silent. Above the crossroads, three lenses glow."};
const ENGINE_CHALLENGES=[{p:"aquinas",taunt:"Faith and reason are enemies. Choose one and abandon the other.",w:"Both come from the same source. Reason can lead toward faith, and faith needn’t fear questions."},{p:"aquinas",taunt:"Right and wrong are whatever the powerful say they are.",w:"Natural law runs deeper than any ruler’s decree. Reason can discover it, and an unjust law falls short of true law."},{p:"kant",taunt:"Lie if it gets results. Rules are for machines.",w:"Could you will that everyone lies whenever it suits them? If not, you can’t make yourself the exception."},{p:"kant",taunt:"People are parts. Use them however the machine needs.",w:"Every person is an end in themselves, never merely a tool."},{p:"mill",taunt:"A fool’s contentment is worth exactly as much as a sage’s joy.",w:"Some pleasures are higher than others. A thoughtful life with some dissatisfaction beats a satisfied fool’s."},{p:"mill",taunt:"Silence anyone who says something you dislike.",w:"Liberty may be limited only to prevent harm to others, and being offended isn’t harm."},{p:"gilligan",taunt:"Feelings are noise. Morality is cold arithmetic, and relationships don’t count.",w:"Care is a moral voice of its own: attending to real people and the relationships you’re in."},{p:"gilligan",taunt:"Only the rules matter. Nobody’s actual situation is worth hearing.",w:"Listening to people in their real situations is part of what morality asks of us."}];

function blit(src,camX,camY,W,H){ // draws only the part of a map layer that's on screen
  const sx=Math.max(0,Math.floor(camX/S)),sy=Math.max(0,Math.floor(camY/S)),sw=Math.min(src.width-sx,Math.ceil(W/S)+2),sh=Math.min(src.height-sy,Math.ceil(H/S)+2);
  if(sw>0&&sh>0)ctx.drawImage(src,sx,sy,sw,sh,sx*S-camX,sy*S-camY,sw*S,sh*S);
}
function drawWater(t,camX,camY,W,H,tp){ // a few open-water cells cycle 4 ripple frames every 300 ms
  const e=ATLAS_IMG[landKey()],A=ATLAS[landKey()];if(paintedWith!=="atlas"||!e||!e.ok||!A||RM.matches)return;
  const fr=Math.floor(t/300),T=A.tile||16;
  for(const w of WQ){const sx=w[0]*tp-camX,sy=w[1]*tp-camY;if(sx<-tp||sy<-tp||sx>W||sy>H)continue;
    const p=A.tiles["water_f"+((fr+w[2])%4)];if(p)ctx.drawImage(e.img,p[0]*T,p[1]*T,T,T,sx,sy,tp,tp)}
}
let fadeCv=null,fadeGrad=null,glowCv=null;
function drawOver(camX,camY,W,H){ // where the overhead layer covers the Wanderer, a soft circle around him shows through at 60%
  const px=pl.x*TS,py=pl.y*TS,cw=MW*4;let under=false;
  if(OVC)for(let yy=Math.floor((py-12)/4);yy<=Math.floor((py+1)/4)&&!under;yy++)for(let xx=Math.floor((px-5)/4);xx<=Math.floor((px+5)/4);xx++)if(xx>=0&&yy>=0&&xx<cw&&yy<MH*4&&OVC[yy*cw+xx]){under=true;break}
  if(!under){blit(overCv,camX,camY,W,H);return}
  const r=22,d=r*2,x0=Math.round(px)-r,y0=Math.round(py-5)-r,dx=x0*S-camX,dy=y0*S-camY;
  // the layer around the square, as four plain strips (no clipping mask: much faster without a graphics chip)
  const vx0=Math.max(0,Math.floor(camX/S)),vy0=Math.max(0,Math.floor(camY/S)),vx1=Math.min(overCv.width,vx0+Math.ceil(W/S)+2),vy1=Math.min(overCv.height,vy0+Math.ceil(H/S)+2);
  const part=(x,y,w,h)=>{const a=Math.max(x,vx0),b=Math.max(y,vy0),c=Math.min(x+w,vx1),e=Math.min(y+h,vy1);if(c>a&&e>b)ctx.drawImage(overCv,a,b,c-a,e-b,a*S-camX,b*S-camY,(c-a)*S,(e-b)*S)};
  part(vx0,vy0,vx1-vx0,y0-vy0);part(vx0,y0+d,vx1-vx0,vy1-y0-d);part(vx0,y0,x0-vx0,d);part(x0+d,y0,vx1-x0-d,d);
  if(!fadeCv){fadeCv=document.createElement("canvas");fadeCv.width=fadeCv.height=d;const g=fadeCv.getContext("2d").createRadialGradient(r,r,0,r,r,r);g.addColorStop(0,"rgba(0,0,0,.4)");g.addColorStop(.62,"rgba(0,0,0,.4)");g.addColorStop(1,"rgba(0,0,0,0)");fadeGrad=g}
  const f=fadeCv.getContext("2d");f.globalCompositeOperation="source-over";f.clearRect(0,0,d,d);
  const sx=Math.max(0,x0),sy=Math.max(0,y0),ex=Math.min(overCv.width,x0+d),ey=Math.min(overCv.height,y0+d);
  if(ex>sx&&ey>sy)f.drawImage(overCv,sx,sy,ex-sx,ey-sy,sx-x0,sy-y0,ex-sx,ey-sy);

const dpad=$("#dpad"),knob=$("#knob");let padId=null;
function padMove(e){const r=dpad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy),m=r.width*.36;
  if(d<10){input.dx=0;input.dy=0;knob.style.transform="";return}
  const a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);input.dx=Math.round(Math.cos(a)*100)/100;input.dy=Math.round(Math.sin(a)*100)/100;
  const k=Math.min(d,m);knob.style.transform=`translate(${Math.cos(Math.atan2(dy,dx))*k}px,${Math.sin(Math.atan2(dy,dx))*k}px)`}
dpad.addEventListener("pointerdown",e=>{e.preventDefault();padId=e.pointerId;dpad.setPointerCapture(e.pointerId);padMove(e)});
dpad.addEventListener("pointermove",e=>{if(e.pointerId===padId)padMove(e)});
const padEnd=e=>{if(e.pointerId===padId){padId=null;input.dx=0;input.dy=0;knob.style.transform=""}};
dpad.addEventListener("pointerup",padEnd);dpad.addEventListener("pointercancel",padEnd);
$("#bA").addEventListener("pointerdown",e=>{e.preventDefault();e.currentTarget.classList.add("on");pressA()});
$("#bB").addEventListener("pointerdown",e=>{e.preventDefault();e.currentTarget.classList.add("on");pressB()});
["bA","bB"].forEach(id=>{const b=$("#"+id);["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove("on")))});
addEventListener("keydown",e=>{
  if(e.target&&e.target.closest&&e.target.closest("textarea,input"))return;
  if($("#modal").innerHTML){if(e.key==="Escape")closeModal();return}
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(screen==="mini"){miniKey(e,k,true);return}
  if(screen==="talk"&&/^[1-4]$/.test(k)){const r=document.querySelectorAll("#replies .reply")[+k-1];if(r){e.preventDefault();r.click()}return}
  input.keys[k]=true;
  const onButton=!!document.activeElement&&document.activeElement.tagName==="BUTTON";
  if(k==="z"||((k==="Enter"||k===" ")&&!onButton)){if(screen==="world"||screen==="talk"||screen==="story"){e.preventDefault();if(!e.repeat)pressA()}}
  if(k==="x"||k==="Escape"){if(screen==="world")pressB();else if(screen==="panel"&&panelFrom)closePanel()}
  if(k.startsWith("Arrow")&&screen==="world")e.preventDefault();
});
addEventListener("keyup",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;input.keys[k]=false;miniKey(e,k,false)});
addEventListener("blur",()=>{input.keys={};input.dx=0;input.dy=0;miniClearInput()});

function pressA(){
  if(screen==="story"){nextStory();return}
  if(screen==="talk"){advance();return}
  if(screen!=="world")return;
  if(signState){signNext();return}
  const it=interactTarget;if(!it)return;
  input.dx=input.dy=0;input.keys={};
  if(it.t==="sign")openSign(it.s.t,it.s.lines);
  else if(it.t==="art"&&it.a.g&&MINI[it.a.g]&&!isFound(it.a))startMini(it.a.g,{art:it.a});
  else if(it.t==="art"&&it.a.g&&!MINI[it.a.g]&&!isFound(it.a)&&document.readyState!=="complete")wtoast("One moment…"); /* Phase 29: its game is still loading */
  else if(it.t==="art"){const A=it.a,first=!isFound(A);P.f[A.id+":"+A.i]=1;saveLocal();if(first)persist();
    openSign("Artifact · "+A.n,A.text);
    if(first){sfx("earned");const n=foundCount(A.id),nm=PH[A.id].n;wtoast(n>=3?`All 3 found. ${nm} is ready to talk.`:`Artifact found: ${n} of 3 for ${nm}`)}}
  else if(it.t==="bar"){const prev=CUR.stations[it.si-1];openSign("Wall of shadow",["A wall of shadow blocks the path.",`It will fade once you’ve spoken with ${PH[prev.id]?speakerName(prev.id).replace(/^The /,"the "):"the thinker nearby"}.`])}
  else if(it.t==="npc"){const n=it.n;
    if(!n.boss&&!cleared(n.id)&&ARTI[n.id]&&foundCount(n.id)<3){const c=foundCount(n.id);openSign(speakerName(n.id),[ARTI[n.id].hint,`You’ve found ${c} of 3 of ${PH[n.id].n}’s artifacts. Look for the glowing objects nearby.`])}
    else startTalk(n)}
}
