<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>The Examined Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F7;--surface:#FFFFFF;--surface2:#F6F7FB;--ink:#1C2040;--muted:#5A5F7D;--line:#D5D8E6;
  --lamp:#E8A93A;--ok:#2E7D4F;--bad:#B3261E;
  --l1:#8E3B5A;--l2:#2F7470;--l3:#4F7E3E;--l4:#A0612E;--relic:#B8860B;--bossc:#3A3550;
  --night:#0E0B1A;--night2:#1A1428;--parch:#F1E8D6;
  box-sizing:border-box;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151833;--surface:#1F2345;--surface2:#262B52;--ink:#ECEBF5;--muted:#A3A6C4;--line:#353B6C;--ok:#7BD69C;--bad:#FF8A80;--l1:#B55580;--l2:#3E9A93;--l3:#6A9E55;--l4:#C67C42;--relic:#D9A93A;--bossc:#57507A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151833;--surface:#1F2345;--surface2:#262B52;--ink:#ECEBF5;--muted:#A3A6C4;--line:#353B6C;--ok:#7BD69C;--bad:#FF8A80;--l1:#B55580;--l2:#3E9A93;--l3:#6A9E55;--l4:#C67C42;--relic:#D9A93A;--bossc:#57507A;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--night);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:var(--f-body);color:#F3EEF8;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--f-head);font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:3px}
.px{font-family:var(--f-head)}
.layer{position:fixed;inset:0}
.hide{display:none!important}

/* ===== Title ===== */
#title{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(34px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% 30%,#3A2A55 0%,#1A1428 55%,#0E0B1A 100%);overflow:hidden}
#title .bgart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#title::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,11,26,.1) 0%,rgba(14,11,26,0) 35%,rgba(14,11,26,.85) 75%,#0E0B1A 100%);pointer-events:none}
#stars{position:absolute;inset:0;width:100%;height:100%}
.tcontent{position:relative;z-index:2;max-width:420px;width:100%}
.tcontent .kicker{font-size:15px;color:#D9C7A0;margin:0 0 6px}
.tcontent h1{font-size:clamp(40px,12vw,58px);line-height:.98;color:#FFF4DC;text-shadow:0 4px 24px rgba(232,169,58,.35)}
.tcontent p.sub{color:#C9BFD9;margin:14px auto 26px;max-width:32ch}
.tlamp{width:78px;height:78px;margin:0 auto 14px;filter:drop-shadow(0 0 22px rgba(240,184,74,.7))}
.gbtn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:700;margin-top:10px;background:rgba(255,255,255,.08);color:#F3EEF8;border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gbtn.main{background:linear-gradient(180deg,#F5C66A,#D9922A);color:#26170A;border-color:#F5C66A;box-shadow:0 6px 24px rgba(232,169,58,.35)}
.gbtn:disabled{opacity:.4}

/* ===== Story / splash ===== */
#story{background:#0E0B1A;display:flex;align-items:center;justify-content:center;padding:32px 28px;text-align:center;overflow:hidden}
#story .bgart{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
#story::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,11,26,.3),rgba(14,11,26,.8));pointer-events:none}
#story .inner{position:relative;z-index:2;max-width:420px}
#story .stext{font-family:var(--f-head);font-size:clamp(21px,5.6vw,27px);line-height:1.4;color:#FFF4DC;min-height:6em}
#story .lvl{font-size:15px;color:#D9C7A0;margin-bottom:8px}
#story .hint{margin-top:26px;color:#A99CC0;font-size:14px}
#story video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:3;background:#000}
.skip{position:absolute;z-index:4;right:16px;top:calc(14px + env(safe-area-inset-top,0px));border:0;border-radius:99px;padding:8px 14px;background:rgba(0,0,0,.5);color:#fff;font-weight:700;font-size:14px}

/* ===== World ===== */
#world{background:#0E0B1A;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(14,11,26,.55);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:6px 12px;font-size:14px;color:#EDE4F7;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pill b{color:#F5C66A}
.pill.btn{border:1px solid rgba(255,255,255,.18);font-weight:700}
.toastw{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:88%;background:rgba(14,11,26,.8);border:1px solid rgba(245,198,106,.45);color:#FFF4DC;border-radius:12px;padding:8px 14px;font-size:14px;text-align:center;transition:opacity .4s;pointer-events:none}
.signbox{position:absolute;left:12px;right:12px;bottom:calc(200px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:#2A2135;border:3px solid #8A6A3A;box-shadow:inset 0 0 0 2px #1A1320,0 8px 30px rgba(0,0,0,.5);border-radius:10px;padding:14px 16px;color:#F1E8D6;font-size:17px}
.signbox .t{font-size:13px;color:#D9C7A0;margin-bottom:4px}
.signbox .more{float:right;font-size:13px;color:#F5C66A;margin-top:6px}

/* Ghost controls */
.ctrl{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));touch-action:none}
#dpad{left:18px;width:148px;height:148px;border-radius:50%;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.16)}
#dpad::before,#dpad::after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,255,255,.14);border-radius:8px;transform:translate(-50%,-50%)}
#dpad::before{width:44px;height:120px}#dpad::after{width:120px;height:44px}
#dpad .knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.3);z-index:2;transition:transform .05s}
#abtns{right:18px;width:156px;height:130px}
.gb{position:absolute;width:68px;height:68px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.09);color:rgba(255,255,255,.85);font-family:var(--f-title);font-size:24px;font-weight:700;touch-action:none}
.gb:active,.gb.on{background:rgba(245,198,106,.35);border-color:rgba(245,198,106,.7)}
#bA{right:0;top:0}#bB{left:0;bottom:0;width:58px;height:58px;font-size:20px}
.gb small{display:block;font-size:10px;font-family:var(--f-body);font-weight:700;opacity:.7;margin-top:-4px}

/* ===== Encounter ===== */
#talk{background:#0E0B1A;overflow:hidden}
#talk .bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;transform:scale(1.06);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.06) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,1%)}}
#talk .bg.noart{display:grid;place-items:center;font-family:var(--f-head);font-size:30vmin;color:rgba(255,255,255,.12)}
#talk .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,11,26,.15) 0%,rgba(14,11,26,0) 30%,rgba(14,11,26,.55) 55%,rgba(14,11,26,.95) 80%)}
.nameplate{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
.nameplate .np{background:linear-gradient(180deg,#F4ECDC,#E2D4B8);color:#221A12;border-radius:10px;padding:6px 14px;font-family:var(--f-head);font-size:19px;box-shadow:inset 0 0 0 2px var(--lc,#8E3B5A),0 4px 16px rgba(0,0,0,.4)}
.nameplate .ty{font-size:13px;color:#EADFCB;text-shadow:0 1px 4px #000}
.leave{position:absolute;right:14px;top:calc(12px + env(safe-area-inset-top,0px));border:0;border-radius:99px;padding:8px 14px;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:14px}
.dlg{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto}
.dbox{position:relative;background:linear-gradient(180deg,rgba(38,28,52,.94),rgba(24,18,34,.96));border:2px solid color-mix(in srgb,var(--lc,#8E3B5A) 70%,#F5C66A);border-radius:16px;padding:16px 18px 18px;box-shadow:0 10px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
.dbox .who{font-size:13px;font-weight:700;color:#F5C66A;margin-bottom:4px}
.dbox .txt{font-family:var(--f-head);font-size:clamp(18px,4.6vw,21px);line-height:1.42;color:#FFF7E8;min-height:3em}
.dbox .txt.narr{font-family:var(--f-body);font-style:italic;color:#D8CCE8}
.dbox .txt .lesson{display:block;font-family:var(--f-body);font-size:16px;color:#E4D9F0;margin-top:8px}
.dbox .cont{position:absolute;right:14px;bottom:8px;color:#F5C66A;font-size:14px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.replies{display:grid;gap:8px;margin-top:10px}
.reply{text-align:left;border:1.5px solid rgba(245,198,106,.35);background:rgba(14,11,26,.78);color:#F6EEDF;border-radius:14px;padding:12px 14px;line-height:1.35;font-size:16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.reply:hover,.reply:focus-visible{border-color:#F5C66A;background:rgba(60,42,20,.85)}
.reply::before{content:"›";color:#F5C66A;font-weight:700;margin-right:8px}
.reply.soft{border-color:rgba(255,255,255,.18)}

/* ===== Reveal / victory ===== */
#reveal{background:radial-gradient(ellipse at 50% 40%,rgba(90,60,120,.92),rgba(14,11,26,.97));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
#reveal h2{font-size:28px;color:#FFF4DC;line-height:1.1}
#reveal p.msg{color:#D8CCE8;margin:8px auto;max-width:34ch}
#reveal .wrapbtn{width:min(320px,100%);margin-top:14px}
#reveal video{width:100%;max-width:420px;max-height:70vh;border-radius:16px;background:#000}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 42%,rgba(245,198,106,.08) 0 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Cards (unchanged frame) ===== */
.card{container-type:inline-size;display:block;width:100%;padding:0;border:0;background:none;text-align:left;color:#1d1b24}
.frame{aspect-ratio:63/88;border-radius:4.6cqw;background:#18161F;padding:2.8cqw;box-shadow:0 1.5cqw 4cqw rgba(0,0,0,.28)}
.inner{height:100%;border-radius:3cqw;padding:2.4cqw;display:flex;flex-direction:column;gap:1.6cqw;background:linear-gradient(165deg,color-mix(in srgb,var(--lc) 70%,#fff) 0%,var(--lc) 28%,var(--lc) 70%,color-mix(in srgb,var(--lc) 60%,#000) 100%)}
.plate{--plate:color-mix(in srgb,var(--lc) 14%,#F4F0E6);background:var(--plate);border-radius:1.8cqw;box-shadow:inset 0 0 0 .5cqw color-mix(in srgb,var(--lc) 55%,#000),0 .5cqw 0 rgba(0,0,0,.25)}
.namebar{display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:1.3cqw 1.6cqw 1.3cqw 3cqw}
.namebar .nm{font-family:var(--f-head);font-size:5.8cqw;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost{flex:none;width:8cqw;height:8cqw;border-radius:50%;display:grid;place-items:center;background:var(--lc);color:#fff;font-family:var(--f-head);font-size:3.6cqw;box-shadow:inset 0 0 0 .5cqw rgba(0,0,0,.3)}
.art{position:relative;flex:none;aspect-ratio:16/11;border-radius:1.2cqw;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--lc) 55%,#fff) 0%,var(--lc) 38%,color-mix(in srgb,var(--lc) 30%,#000) 100%);box-shadow:inset 0 0 0 .7cqw rgba(0,0,0,.45)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art .mono{font-family:var(--f-head);font-size:17cqw;color:rgba(255,255,255,.9)}
.typebar{display:flex;align-items:center;justify-content:space-between;padding:1.1cqw 2cqw 1.1cqw 3cqw;font-weight:700;font-size:3.9cqw;line-height:1.2}
.gem{flex:none;width:3.6cqw;height:3.6cqw;transform:rotate(45deg);border-radius:.6cqw;box-shadow:inset 0 0 0 .5cqw rgba(0,0,0,.35)}
.g-common{background:#7C8391}.g-rare{background:#5FB3C9}.g-epic{background:#9B5DE5}.g-legendary{background:linear-gradient(135deg,#FFE9A6,#D39B1C)}
.textbox{flex:1;min-height:0;overflow:hidden;padding:2.4cqw 3cqw;font-size:3.9cqw;line-height:1.32;border-radius:1.2cqw}
.textbox .pw{margin:0}.textbox .pw b{font-family:var(--f-head);font-weight:400}
.textbox hr{border:0;border-top:.4cqw solid color-mix(in srgb,var(--lc) 40%,transparent);margin:1.8cqw 6cqw}
.textbox .flav{margin:0;font-style:italic;color:#5b5664;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;justify-content:space-between;padding:0 .6cqw;color:rgba(255,255,255,.88);font-size:3.2cqw}
.pt{color:#1d1b24;padding:.6cqw 2.6cqw;font-family:var(--f-head);font-size:5cqw}
.r-epic .inner{box-shadow:inset 0 0 0 .6cqw rgba(255,255,255,.35)}
.r-legendary .inner{background:linear-gradient(120deg,#8A6208,#F5D77A,#B8860B,#FFF1B8,#8A6208);background-size:300% 300%;animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.card.locked .inner{background:#2A2735}.card.locked .art{background:#1F1C28}.card.locked .mono{color:rgba(255,255,255,.25)}
.card.locked .plate{--plate:#3A3646;color:#A9A3B8;box-shadow:none}
.reveal-card{perspective:1200px;width:min(64vw,270px);margin:16px auto 6px}
.flipper{position:relative;transform-style:preserve-3d;animation:flip 1.1s .25s cubic-bezier(.3,.7,.2,1) both}
.flipper .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipper .backside{position:absolute;inset:0;transform:rotateY(180deg);border-radius:18px;background:#18161F;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
@keyframes flip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}

/* ===== Menu & panels (app-style) ===== */
#panel{background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;-webkit-user-select:text;user-select:text}
#panel .wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.link{background:none;border:0;padding:8px 4px;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}.small{font-size:14px}
.btn{border-radius:14px;padding:14px 18px;font-weight:700;background:var(--surface);border:1.5px solid var(--line);text-align:center;width:100%;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:9px 12px;font-size:14px;width:auto;border-radius:11px}
.btn:disabled{opacity:.45}
.stack{display:grid;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.slot{display:flex;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
.thumb{flex:none;width:84px;aspect-ratio:16/11;border-radius:10px;overflow:hidden;background:var(--lc);display:grid;place-items:center;color:#fff;font-family:var(--f-head);font-size:22px}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.slot .meta{flex:1;min-width:0}.slot .meta b{display:block;font-size:15px;line-height:1.25}.slot .meta span{font-size:13px;color:var(--muted)}
.slot .acts{display:grid;gap:6px}
.studio-h{font-size:18px;margin:18px 2px 8px}
.toast{background:var(--surface);border:1.5px solid var(--lamp);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.menu-list{display:grid;gap:10px;margin-top:10px}

.overlay{position:fixed;inset:0;background:rgba(10,12,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:80}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:14px 18px calc(28px + env(safe-area-inset-bottom,0px));-webkit-user-select:text;user-select:text}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet .card{max-width:280px;margin:6px auto 18px}
.sec{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.sec h4{margin:0 0 4px;font-size:14px;color:var(--muted)}.sec p{margin:0}.sec p+p{margin-top:4px}
.sec.term b{font-family:var(--f-head);font-weight:400;font-size:18px}
#filepick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.flipper,#talk .bg,.rays,.r-legendary .inner,.dbox .cont{animation:none}}

/* ================= STORYBOOK + STAINED GLASS THEME ================= */
:root{--f-title:"Cinzel Decorative",Georgia,serif;--f-head:"IM Fell English SC",Georgia,serif;--f-story:"IM Fell English",Georgia,serif;--f-body:"EB Garamond",Georgia,serif;
  --lead:#100B15;--gold:#D9A93A;--parch:#F1E6CF;
  --band:repeating-linear-gradient(118deg,#7A6A9A 0 14px,var(--lead) 14px 16px,#4A4066 16px 28px,var(--lead) 28px 30px,#8A7AAA 30px 40px,var(--lead) 40px 42px,#5A7A8A 42px 52px,var(--lead) 52px 54px);
  --bandgold:repeating-linear-gradient(118deg,#E0B055 0 14px,var(--lead) 14px 16px,#9A6A20 16px 28px,var(--lead) 28px 30px,#C0503A 30px 38px,var(--lead) 38px 40px,#F2CF7A 40px 52px,var(--lead) 52px 54px);
  --glass:linear-gradient(180deg,rgba(38,28,50,.94),rgba(18,12,26,.97))}
body{font-family:var(--f-body);font-size:18px}
h1,h2,h3,.px{font-family:var(--f-head);font-weight:400;letter-spacing:.02em}
/* title */
.tcontent .kicker{font-family:var(--f-head);font-size:17px;letter-spacing:.12em;color:#E0C98F}

/* HUD */

.signbox{font-family:var(--f-story);font-size:19px;line-height:1.45;color:#F4EAD6;border:6px solid transparent;border-radius:14px;
  background:var(--glass) padding-box,var(--band) border-box;box-shadow:0 0 0 2px var(--lead),inset 0 0 0 2px var(--lead),0 10px 34px rgba(0,0,0,.6)}

.signbox .more{font-family:var(--f-head);color:#F5D48A}
.gb{font-family:var(--f-title);font-size:22px;color:rgba(255,236,190,.9);border:2px solid rgba(217,169,58,.4);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.14),rgba(40,28,52,.35))}
#bB{font-size:18px}
#dpad{border:2px solid rgba(217,169,58,.3)}
/* encounter */
#talk .bg.noart{font-family:var(--f-title)}
.nameplate .np{font-family:var(--f-head);font-size:20px;letter-spacing:.03em;color:#FFE9B8;border:4px solid transparent;border-radius:12px;padding:5px 14px;
  background:linear-gradient(180deg,#4A3016,#241608) padding-box,var(--bandgold) border-box;box-shadow:0 0 0 1.5px var(--lead),0 6px 20px rgba(0,0,0,.5)}
.nameplate .ty{font-family:var(--f-story);font-style:italic;font-size:16px;color:#EDE2CC}
.dbox{border:8px solid transparent;border-radius:18px;padding:14px 18px 20px;
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--lc) 26%,transparent),transparent 62%) padding-box,
    radial-gradient(120% 90% at 100% 100%,rgba(217,169,58,.14),transparent 60%) padding-box,
    linear-gradient(180deg,rgba(30,22,40,.95),rgba(14,10,20,.97)) padding-box,
    repeating-linear-gradient(118deg,color-mix(in srgb,var(--lc) 90%,#fff) 0 22px,var(--lead) 22px 24px,#C79A3A 24px 34px,var(--lead) 34px 36px,color-mix(in srgb,var(--lc) 55%,#000) 36px 58px,var(--lead) 58px 60px,#5FA8B8 60px 70px,var(--lead) 70px 72px,#E7C77A 72px 80px,var(--lead) 80px 82px) border-box;
  box-shadow:0 0 0 2.5px var(--lead),inset 0 0 0 2px var(--lead),inset 0 1px 0 rgba(255,255,255,.07),0 0 34px color-mix(in srgb,var(--lc) 45%,transparent),0 14px 40px rgba(0,0,0,.6)}
.dbox::before,.dbox::after{content:"";position:absolute;top:-14px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#FFF3C8,#E0AE4A 45%,#6E4A0E);box-shadow:0 0 0 2.5px var(--lead),0 0 12px rgba(245,198,106,.65)}
.dbox::before{left:-14px}.dbox::after{right:-14px}
.dbox .who{font-family:var(--f-head);font-size:17px;font-weight:400;letter-spacing:.06em;color:#F5D48A}
.dbox .txt{font-family:var(--f-story);font-size:clamp(19px,5vw,22px);line-height:1.45;color:#FBF1DE}
.dbox .txt.narr{font-family:var(--f-story);font-style:italic;color:#DCCFE8}
.dbox .txt .lesson{font-family:var(--f-body);font-size:17px;line-height:1.45;color:#E8DCC8;border-top:1px solid rgba(217,169,58,.3);padding-top:8px;margin-top:10px}
.dbox .cont{color:#F5D48A;font-family:var(--f-head)}
.replies{gap:10px;margin-top:12px}
.reply{font-family:var(--f-story);font-size:18px;line-height:1.35;color:#F6ECD8;border:4px solid transparent;border-radius:12px;padding:11px 14px;
  background:linear-gradient(180deg,rgba(30,22,40,.92),rgba(16,11,22,.95)) padding-box,repeating-linear-gradient(118deg,#A8843A 0 12px,var(--lead) 12px 14px,#5E5080 14px 24px,var(--lead) 24px 26px,#7A3A50 26px 34px,var(--lead) 34px 36px) border-box;
  box-shadow:0 0 0 1.5px var(--lead),0 6px 18px rgba(0,0,0,.45);backdrop-filter:none;-webkit-backdrop-filter:none}
.reply:hover,.reply:focus-visible{background:linear-gradient(180deg,rgba(70,48,20,.92),rgba(34,22,10,.95)) padding-box,var(--bandgold) border-box;color:#FFF2D0}
.reply::before{content:"✦";color:#E0AE4A;font-weight:400;margin-right:10px}
.reply.soft{background:linear-gradient(180deg,rgba(30,22,40,.85),rgba(16,11,22,.9)) padding-box,var(--band) border-box;color:#D8CCE4}
/* reveal */

#reveal p.msg{font-family:var(--f-story);font-size:18px;color:#E2D6EA}
#reveal p.px{font-family:var(--f-head);letter-spacing:.14em;font-size:15px}
/* cards */
.namebar .nm{font-family:var(--f-head);font-size:6.3cqw;letter-spacing:.02em}
.cost{font-family:var(--f-title);font-size:3.6cqw}
.art .mono{font-family:var(--f-title)}
.typebar{font-family:var(--f-head);font-weight:400;font-size:4.3cqw}
.textbox{font-family:var(--f-story);font-size:4.2cqw;line-height:1.32}
.textbox .pw b{font-family:var(--f-head)}
.pt{font-family:var(--f-head);font-size:5.4cqw}
/* panels: collection, studio, menu, card sheets */
#panel,.sheet{--bg:#15101F;--surface:rgba(30,22,40,.92);--surface2:#241B30;--ink:#F1E6CF;--muted:#BBAACB;--line:#3A2E4A;color:var(--ink)}
#panel{background:radial-gradient(ellipse at 50% 0%,#2E2240 0%,#16101F 55%,#0E0B1A 100%) fixed}
#panel h2{font-family:var(--f-head);color:#FFE3A8;letter-spacing:.03em}
#panel .muted,.sheet .muted{color:#BBAACB}
.link{font-family:var(--f-head);font-size:17px;font-weight:400;color:#E0C98F;letter-spacing:.03em}
.btn{font-family:var(--f-head);font-size:18px;font-weight:400;letter-spacing:.04em;color:var(--parch);border:4px solid transparent;border-radius:12px;background:var(--glass) padding-box,var(--band) border-box;box-shadow:0 0 0 1.5px var(--lead),0 6px 18px rgba(0,0,0,.35)}
.btn.primary{color:#FFE9B8;background:linear-gradient(180deg,#5A3A14,#2E1E0C) padding-box,var(--bandgold) border-box;border-color:transparent}
.btn.sm{font-size:15px;border-width:3px;padding:7px 12px}

.sec h4{font-family:var(--f-head);font-weight:400;font-size:16px;letter-spacing:.05em;color:#F5D48A}
.sec p{font-family:var(--f-body);font-size:17px;line-height:1.5}
.sec.term b{font-family:var(--f-story)}
.slot .meta b{font-family:var(--f-head);font-weight:400;font-size:17px}
.slot .meta span{font-family:var(--f-story);font-style:italic}
.studio-h{font-family:var(--f-head);color:#F5D48A;letter-spacing:.04em}
.thumb{font-family:var(--f-title);box-shadow:0 0 0 2px var(--lead)}
.chip{font-family:var(--f-head);font-weight:400;font-size:15px;color:var(--parch);border:3px solid transparent;background:var(--glass) padding-box,var(--band) border-box}
.chip[aria-pressed="true"]{color:#FFE9B8;background:linear-gradient(180deg,#5A3A14,#2E1E0C) padding-box,var(--bandgold) border-box}
.toast{font-family:var(--f-story);border:3px solid transparent;background:var(--glass) padding-box,var(--bandgold) border-box}
.overlay{background:rgba(6,4,12,.7)}
.sheet{background:radial-gradient(ellipse at 50% 0%,#2E2240 0%,#16101F 60%) ;box-shadow:0 -2px 0 var(--lead),0 -6px 0 #6A5A8A}
.sheet .grab{background:#6A5A8A}
.nameplate{right:96px;flex-wrap:wrap;row-gap:4px}
.nameplate .ty{min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skip.snd{top:auto;right:auto;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.dbox .txt .pre{display:block;font-family:var(--f-story);font-style:italic;font-size:17px;color:#D9CBE4;margin-bottom:4px}.dbox .txt .lesson:empty{display:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
.dlg{max-height:calc(100% - 96px - env(safe-area-inset-top,0px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:16px}
#story{padding:calc(32px + env(safe-area-inset-top,0px)) 28px calc(32px + env(safe-area-inset-bottom,0px))}
#story .inner{height:auto;display:block;padding:0;gap:0;border-radius:0;background:none;box-shadow:none}
#story.hasart{align-items:flex-end;padding-bottom:calc(10vh + env(safe-area-inset-bottom,0px))}
#story.hasart .bgart{opacity:.9}
#story.hasart::after{background:linear-gradient(180deg,rgba(14,11,26,0) 0%,rgba(14,11,26,.1) 40%,rgba(14,11,26,.8) 66%,rgba(14,11,26,.96) 100%)}
#story.hasart .stext{min-height:0}
/* Phase 45B: storybook pages. The art (572 x 1024) always fills the screen height, anchored at the top (cover on a phone, contain on a wider screen), so its empty parchment (y 72-96%) is always in the same place. */
#story.parch .bgart{opacity:1;object-fit:cover;object-position:50% 0}
@media (min-aspect-ratio:572/1024){#story.parch .bgart{object-fit:contain}}
#story.parch::after{display:none}
#story.parch .inner{position:absolute;left:50%;transform:translateX(-50%);top:72.5vh;top:72.5dvh;bottom:3.5vh;bottom:3.5dvh;width:min(calc(100vw - 48px),48vh);width:min(calc(100vw - 48px),48dvh);display:flex;flex-direction:column;justify-content:center;max-width:none}
#story.parch .stext{color:#3A2A1A;text-shadow:none;font-size:clamp(15px,2.35vh,22px);font-size:clamp(15px,2.35dvh,22px);line-height:1.38;min-height:0}
#story.parch .lvl{display:none}
#story.parch .hint{color:#6B5236;margin-top:10px;font-size:clamp(12px,1.6vh,15px)}
#story.endglow::after{background:linear-gradient(180deg,rgba(232,169,58,.16) 0%,rgba(14,11,26,0) 30%,rgba(14,11,26,.82) 66%,#0E0B1A 100%)}
.donebadge{font-family:var(--f-head);font-size:14px;letter-spacing:.1em;color:#FFE9B8;background:rgba(232,169,58,.16);border:1.5px solid rgba(232,169,58,.5);border-radius:99px;padding:5px 14px;display:inline-block;margin:0 auto 10px}
#credits{background:radial-gradient(ellipse at 50% 20%,#241A38 0%,#0E0B1A 60%)}
#credits .creelWrap{position:absolute;inset:0;overflow:hidden;padding:0 28px}
#credits.still .creelWrap{overflow-y:auto;-webkit-overflow-scrolling:touch}
#creditsReel{position:absolute;left:0;right:0;top:0;text-align:center}
#credits.still #creditsReel{position:static;top:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 0 150px}
#creditsReel h1{font-family:var(--f-title);font-size:clamp(30px,8vw,42px);color:#FFEBC0;text-shadow:0 2px 0 #3A2410,0 0 30px rgba(232,169,58,.4);margin:0 0 6px}
#creditsReel h3{font-family:var(--f-head);font-size:18px;letter-spacing:.1em;color:#E0C98F;margin:26px 0 8px}

#creditsReel p.sub{color:#C9BFD9;font-style:italic;margin-bottom:24px}
#creditsReel p.sp{margin-top:18px}
#creditsReel p.thanks{margin-top:34px;font-style:italic;color:#FFE9B8}
.creditsBtn{position:absolute;left:16px;right:16px;width:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto}
@media (prefers-reduced-motion:reduce){#creditsReel{animation:none}}
/* ===== Mini-game stage (Phase 20) ===== */
#mini{background:radial-gradient(ellipse at 50% 30%,#1A1428 0%,#0E0B1A 70%);touch-action:none;overflow:hidden;-webkit-user-select:none;user-select:none}
#mini .mhud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;z-index:3;pointer-events:none}
#mini .mhud .pill{white-space:nowrap}#mTitle{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block}#mPause{width:auto;flex:none}
#mini .mhr{display:flex;gap:6px;flex:none}#mHelp,#mWalkC{width:auto;flex:none}#mHelp{min-width:34px} /* Phase 45B: the ? card and the Walk on chip */
.mhow{text-align:left;margin:0}.mhow b{color:var(--gold,#F5C66A);font-weight:600;letter-spacing:.04em;font-size:.82em;text-transform:uppercase;display:block;margin-top:2px}
.pill.glow{box-shadow:0 0 0 1.5px var(--lead),0 0 16px rgba(245,198,106,.85)}
#mFrame{position:absolute;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));padding:3px;line-height:0;border-radius:6px;background:var(--band);box-shadow:0 0 0 1.5px var(--lead),0 10px 30px rgba(0,0,0,.55)}
#mcv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0E0B1A;border-radius:3px}
#mPlate{position:absolute;left:3px;top:3px;right:3px;bottom:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:cover;border-radius:3px;opacity:0;pointer-events:none;transform-origin:50% 35%}
#mPlate.on{animation:mplatein 7s ease-out forwards}
@keyframes mplatein{from{transform:scale(1)}to{transform:scale(1.045)}}
#mBanner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--f-head);font-size:19px;letter-spacing:.08em;color:#FFE9B8;padding:8px 18px;border:4px solid transparent;border-radius:12px;background:linear-gradient(180deg,rgba(40,26,16,.94),rgba(20,13,8,.96)) padding-box,var(--bandgold) border-box;box-shadow:0 0 0 1.5px var(--lead),0 0 26px rgba(232,169,58,.35);line-height:1.2;pointer-events:none;animation:mbanner 1.6s ease forwards}
@keyframes mbanner{0%{opacity:0;transform:translate(-50%,-40%) scale(.96)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#mSay{position:absolute;left:10px;right:10px;top:10px;font-family:var(--f-body);font-size:14px;line-height:1.3;color:#F4EAD6;padding:7px 11px;border:3px solid transparent;border-radius:10px;background:linear-gradient(180deg,rgba(30,20,40,.9),rgba(16,11,21,.92)) padding-box,var(--bandgold) border-box;box-shadow:0 0 0 1.5px var(--lead);pointer-events:none;animation:msay 4.4s ease forwards}
#mSay b{display:block;font-family:var(--f-head);font-weight:normal;font-size:12px;letter-spacing:.06em;color:#F5C66A;margin-bottom:1px}
@keyframes msay{0%{opacity:0}8%{opacity:1}86%{opacity:1}100%{opacity:0}}
.mpips{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}.mpips i{width:7px;height:7px;border-radius:50%;background:#3A2E4A;box-shadow:0 0 0 1px var(--lead)}.mpips i.on{background:#F5C66A;box-shadow:0 0 0 1px var(--lead),0 0 6px rgba(245,198,106,.8)}
@media (prefers-reduced-motion:reduce){#mPlate.on{animation:none}#mBanner{animation:mbannerrm 1.6s linear forwards}@keyframes mbannerrm{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{opacity:0}}}
#mpad{left:18px;width:148px;height:148px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(217,169,58,.3);z-index:2}
#mpad::before,#mpad::after{content:"";position:absolute;left:50%;top:50%;background:rgba(255,255,255,.14);border-radius:8px;transform:translate(-50%,-50%)}
#mpad::before{width:44px;height:120px}#mpad::after{width:120px;height:44px}
#mpad .knob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.3);z-index:2;transition:transform .05s}
#mab{right:18px;width:156px;height:130px;z-index:2}
#mA{right:0;top:0}#mB{left:0;bottom:0;width:58px;height:58px;font-size:18px}
#mCard{position:absolute;left:0;right:0;bottom:0;padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:4;max-height:calc(100% - 70px);overflow-y:auto}
#mCard .dbox .txt{min-height:0}

/* Phase 36: the mini-game gallery and plate thumbnails */
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gcard{display:block;align-self:start;min-width:0;background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:var(--parch)}

<script>
const LEVELS=[
 {id:"l1",num:"I",name:"The Meaning-Makers",desc:"Freedom, choice, and building a meaningful life.",lc:"var(--l1)",
  ph:["kierkegaard","nietzsche","camus","sartre","beauvoir","frankl","fromm"],boss:"b1"},
 {id:"l2",num:"II",name:"The Ancient Life Coaches",desc:"Philosophy as daily training for a good life.",lc:"var(--l2)",
  ph:["socrates","aristotle","epicurus","seneca","epictetus","marcus"],boss:"b2"},
 {id:"l3",num:"III",name:"The Eastern Way",desc:"Letting go, flowing with life, and loosening the grip of the self.",lc:"var(--l3)",
  ph:["buddha","laozi","zhuangzi","confucius","dogen"],boss:"b3"},
 {id:"l4",num:"IV",name:"The Ethics Toolkit",desc:"The main lenses for deciding right from wrong.",lc:"var(--l4)",
  ph:["aquinas","kant","mill","gilligan"],boss:"b4"}
];

/* q: t = "q" quiz or "s" scenario; o[0] is always the correct answer (shuffled on screen); w = why */
const PH={
kierkegaard:{n:"Søren Kierkegaard",m:"SK",ep:"The Knight of Faith",d:"1813–1855",pl:"Copenhagen, Denmark",r:"epic",mv:"The Leap",st:[6,10,3,8],
 core:"Anxiety is the dizzy feeling that comes with real freedom. Most people drift along with ‘the crowd.’ Becoming a true self means making a passionate, personal commitment rather than going along.",
 term:["The three stages","Three ways of living: chasing pleasure (aesthetic), committing to duty (ethical), and a life of personal faith (religious)."],
 pw:["The Leap","Helps you stop drifting with the crowd and commit, with your whole heart, to the self you choose to become."], /* Phase 39: the card power (D8) */
 rel:"Devout Lutheran Christian. He attacked Denmark’s official state church for turning faith into a comfortable social habit. His whole philosophy asks how to become a genuine Christian, not one in name only.",
 prac:"Name one area of life where you’re just following the crowd. Make one small, personal choice there this week.",
 book:"Philosopher of the Heart by Clare Carlisle",al:"Viktor Frankl",ri:"Nietzsche, Camus",
 taunt:"You follow the crowd so well. Can you choose anything for yourself?"},
nietzsche:{n:"Friedrich Nietzsche",m:"FN",ep:"The Hammer",d:"1844–1900",pl:"Prussia (Germany)",r:"epic",mv:"Eternal Return",st:[6,10,4,10],
 core:"Europe was losing the shared beliefs that gave life meaning, which risks nihilism: the feeling that nothing matters. His answer is to create your own values and say a full ‘yes’ to life, hardships included.",
 term:["Amor fati","‘Love of fate.’ Embracing everything that happens, not just putting up with it."],
 pw:["Eternal Return","Helps you create values of your own and say a full yes to your life, hard parts included."], /* Phase 39: the card power (D8) */
 rel:"Son and grandson of Lutheran pastors, and he briefly studied theology. He broke with Christianity and criticized its morality, but spent his life wrestling with what could replace it.",
 prac:"Ask of a recent day: would I live this exact day again, forever? Keep the parts you’d repeat; question the rest.",
 book:"Hiking with Nietzsche by John Kaag",al:"Camus, Sartre",ri:"Kierkegaard, Kant",
 taunt:"Would you live this exact life again, forever? Show me."},
camus:{n:"Albert Camus",m:"AC",ep:"The Rebel",d:"1913–1960",pl:"French Algeria and France",r:"rare",mv:"Revolt",st:[7,8,7,8],
 core:"Life is ‘absurd’: we crave meaning, but the universe stays silent. Instead of despair or false comfort, rebel by living fully and honestly anyway.",
 term:["The absurd","The clash between our hunger for meaning and a universe that gives no answer."],
 pw:["Revolt","Helps you face a world that gives no answers, and live fully and honestly anyway."], /* Phase 39: the card power (D8) */
 rel:"Grew up poor in culturally Catholic French Algeria. A non-believer who respected believers; he wrote his university thesis partly on Saint Augustine and kept friendly debates with Christians.",
 prac:"When a task feels pointless, do it fully anyway, and notice what it feels like to own it.",
 book:"The Myth of Sisyphus by Albert Camus",al:"Nietzsche",ri:"Kierkegaard; Sartre (they famously fell out)",
 taunt:"The universe won’t answer you. What will you do about it?"},
sartre:{n:"Jean-Paul Sartre",m:"JS",ep:"The No-Excuses Man",d:"1905–1980",pl:"Paris, France",r:"rare",mv:"Radical Freedom",st:[6,9,4,9],
 core:"There is no built-in human nature. You exist first, then define yourself through your choices, and you’re responsible for them.",
 term:["Bad faith","Lying to yourself that you have no choice."],
 pw:["Radical Freedom","Helps you own your choices, drop your excuses, and make yourself through what you do."], /* Phase 39: the card power (D8) */
 rel:"Raised with both Catholic and Protestant influences, he became a committed atheist. His starting point: if no God designed us, we have to define ourselves.",
 prac:"Catch yourself saying ‘I have to.’ Replace it with ‘I choose to, because…’ and check if it’s true.",
 book:"At the Existentialist Café by Sarah Bakewell",al:"Simone de Beauvoir",ri:"Camus",
 taunt:"No excuses. Every answer here is your choice."},
beauvoir:{n:"Simone de Beauvoir",m:"SB",ep:"The Freedom Builder",d:"1908–1986",pl:"Paris, France",r:"rare",mv:"Shared Liberation",st:[7,8,5,8],
 core:"Freedom isn’t just personal. My freedom is tied to other people’s freedom, and a good life works to expand both.",
 term:["The Ethics of Ambiguity","Her book arguing that existentialism can ground a real ethics: we’re free, but never alone."],
 pw:["Shared Liberation","Helps you see what you were taught to be, and work for a freedom that includes everyone."], /* Phase 39: the card power (D8) */
 rel:"A devout Catholic as a child, she lost her faith as a young teenager and remained an atheist. She built ethics on human freedom rather than divine law.",
 prac:"This week, do one thing that expands someone else’s freedom or options.",
 book:"At the Existentialist Café by Sarah Bakewell",al:"Sartre, Carol Gilligan",ri:"Anyone who says your role is fixed at birth",
 taunt:"You think you’re free. And what about everyone else?"},
frankl:{n:"Viktor Frankl",m:"VF",ep:"The Meaning Doctor",d:"1905–1997",pl:"Vienna, Austria",r:"epic",mv:"Will to Meaning",st:[10,8,9,8],
 core:"Our deepest drive is the search for meaning. We find it by creating or doing something, by loving and experiencing, and by the attitude we choose toward suffering we can’t avoid.",
 term:["Logotherapy","Frankl’s therapy approach, from the Greek ‘logos’ (meaning): healing through meaning."],
 pw:["Will to Meaning","Helps you find meaning in what you create, in whom you love, and in how you meet suffering you cannot avoid."], /* Phase 39: the card power (D8) */
 rel:"Jewish. His parents, wife, and brother died in the Holocaust. Logotherapy welcomes religious meaning without requiring it; he spoke of an ‘ultimate meaning’ beyond our full understanding.",
 prac:"Ask: what is life asking of me right now? Answer with one concrete action.",
 book:"Yes to Life by Viktor Frankl (a short follow-up to Man’s Search for Meaning)",al:"Epictetus, Kierkegaard",ri:"Freud (Frankl said pleasure isn’t our main drive)",
 taunt:"Don’t ask what you want from life. What is life asking of you?"},
fromm:{n:"Erich Fromm",m:"EF",ep:"The Humanist",d:"1900–1980",pl:"Germany, the United States, Mexico, and Switzerland",r:"rare",mv:"Being Mode",st:[9,7,8,7],
 core:"Modern life pushes us toward ‘having’: defining ourselves by what we own and control. A fuller life comes from ‘being’: growing, creating, loving, and sharing.",
 term:["Having vs. being","Two ways of living: identity through possessions, or identity through what you do and experience."],
 pw:["Being Mode","Helps you love as an art you practice, and live by being and sharing instead of having."], /* Phase 39: the card power (D8) */
 rel:"Raised in an Orthodox Jewish family; left religious practice in his twenties and called himself a ‘non-theist.’ He still drew deeply on the Hebrew prophets and on Zen Buddhism.",
 prac:"For one day, notice how often you think in ‘having’ terms. Trade one of those for a ‘being’ activity.",
 book:"The Art of Loving by Erich Fromm",al:"The Buddha, Dōgen",ri:"Consumer culture",
 taunt:"Are you here to have answers, or to be changed by them?"},
socrates:{n:"Socrates",m:"S",ep:"The Gadfly",d:"c. 470–399 BC",pl:"Athens, Greece",r:"rare",mv:"Endless Question",st:[8,8,7,10],
 core:"The unexamined life isn’t worth living. Wisdom begins with admitting what you don’t know and testing your beliefs through questions.",
 term:["Socratic method","Asking a chain of questions to test a belief and expose its weak spots."],
 pw:["Endless Question","Helps you test what you believe, one honest question at a time, until you find what it really rests on."], /* Phase 39: the card power (D8) */
 rel:"Believed in the gods and claimed an inner divine ‘sign’ that warned him away from wrong actions. Ironically, Athens executed him partly on a charge of impiety.",
 prac:"Pick one belief you hold strongly. Ask ‘why?’ five times in a row.",
 book:"Plato’s ‘Apology’ (short, and Socrates’ own defense speech)",al:"Aristotle (through Plato)",ri:"The Sophists",
 taunt:"You think you know. Let’s find out."},
aristotle:{n:"Aristotle",m:"A",ep:"The Master of Habits",d:"384–322 BC",pl:"Greece",r:"epic",mv:"Golden Mean",st:[9,9,5,10],
 core:"The goal of life is flourishing: becoming the best version of yourself. Good character is built through habits, and each virtue sits between two extremes.",
 term:["Eudaimonia","Flourishing, or living well. More than a good mood; a whole life lived excellently."],
 pw:["Golden Mean","Helps you build good character through practice, and find the right middle between too much and too little."], /* Phase 39: the card power (D8) */
 rel:"Believed in an ‘unmoved mover’ as the first cause of the universe, but his ethics don’t depend on gods. Christian, Muslim, and Jewish thinkers later built on his ideas.",
 prac:"Choose one virtue to build. Do one small act of it every day for two weeks.",
 book:"Aristotle’s Way by Edith Hall",al:"Aquinas, Confucius",ri:"Epicurus",
 taunt:"Excellence is a habit. Let’s see yours."},
epicurus:{n:"Epicurus",m:"E",ep:"The Gardener",d:"341–270 BC",pl:"Athens, Greece",r:"common",mv:"Garden Retreat",st:[9,6,8,7],
 core:"The good life is peace of mind: simple pleasures, close friends, and freedom from fear. Luxury often brings more worry than joy.",
 term:["Ataraxia","Tranquility: a calm mind, free from anxiety."],
 pw:["Garden Retreat","Helps you find calm in simple pleasures and good friends, free from needless fear."], /* Phase 39: the card power (D8) */
 rel:"Believed gods exist but take no interest in humans, and that the soul ends at death. His aim was to free people from fear of divine punishment.",
 prac:"List what truly gives you peace. Cut one thing that adds worry without adding joy.",
 book:"How to Be an Epicurean by Catherine Wilson",al:"The Buddha",ri:"The Stoics",
 taunt:"Relax. Fear is the only real enemy here."},
seneca:{n:"Seneca",m:"Se",ep:"The Timekeeper",d:"c. 4 BC–65 AD",pl:"Rome",r:"common",mv:"Time Guard",st:[9,7,9,8],
 core:"Life isn’t short; we waste much of it. Guard your time, prepare for setbacks in advance, and focus on what truly matters.",
 term:["Premeditation of evils","Imagining possible setbacks ahead of time so they lose their power over you."],
 pw:["Time Guard","Helps you guard your hours and meet setbacks prepared, because you pictured them first."], /* Phase 39: the card power (D8) */
 rel:"Stoic belief in a divine reason running through nature; he wrote of a god within each person. Later Christians admired him so much they forged letters between him and Saint Paul.",
 prac:"Track one evening’s time like a budget. Where did it really go?",
 book:"On the Shortness of Life by Seneca",al:"Epictetus, Marcus Aurelius",ri:"Epicurus (though he quotes him often)",
 taunt:"You’re spending time on me. Make it count."},
epictetus:{n:"Epictetus",m:"Ep",ep:"The Freed Teacher",d:"c. 50–135 AD",pl:"Greece and Rome",r:"rare",mv:"Control Split",st:[10,7,8,8],
 core:"Some things are up to us: our judgments, choices, and actions. Everything else isn’t. Put your energy only where you have control.",
 term:["Dichotomy of control","Splitting life into what’s up to you and what isn’t."],
 pw:["Control Split","Helps you sort what is up to you from what is not, and put your effort where it counts."], /* Phase 39: the card power (D8) */
 rel:"Spoke warmly of God as the father of all people and of our reason as a piece of the divine. This is the Stoic God woven into nature, not the personal God of the Bible.",
 prac:"Sort a current worry into ‘in my control’ and ‘not in my control.’ Act only on the first list.",
 book:"The Enchiridion (‘Handbook’) of Epictetus, very short",al:"Marcus Aurelius, Viktor Frankl",ri:"Epicurus",
 taunt:"Your answers are up to you. The outcome isn’t."},
marcus:{n:"Marcus Aurelius",m:"MA",ep:"The Stoic Emperor",d:"121–180 AD",pl:"Rome",r:"epic",mv:"View from Above",st:[10,8,9,9],
 core:"The most powerful man in the world wrote private reminders to stay humble, patient, and good. Expect difficulty, do your duty, and keep perspective.",
 term:["The view from above","Imagining your problems from high above, seeing how small they are within all of space and time."],
 pw:["View from Above","Helps you see your troubles from high above, then return to your duties with patience and humility."], /* Phase 39: the card power (D8) */
 rel:"Held the Stoic view of a divine, rational order, but openly wrestled with doubt. His answer: whether the world runs by providence or random atoms, act well either way.",
 prac:"Before bed, write three short reminders about how you want to act tomorrow.",
 book:"Meditations by Marcus Aurelius (Gregory Hays translation)",al:"Epictetus, Seneca",ri:"Anger",
 taunt:"Morning reminder: you’ll meet a difficult opponent today. It’s me."},
buddha:{n:"The Buddha",m:"B",ep:"The Awakened One",d:"c. 5th century BC",pl:"Northern India and Nepal",r:"epic",mv:"Middle Way",st:[10,10,7,10],
 core:"Life involves dissatisfaction, caused by craving and clinging. It can end, and there’s a practical path to get there: ethical living, mindfulness, and meditation.",
 term:["Impermanence","Everything changes, including feelings, circumstances, and the self."],
 pw:["Middle Way","Shows how much dissatisfaction grows from craving, and gives a practical path to meet change calmly."], /* Phase 39: the card power (D8) */
 rel:"Born into the ruling family of the Shakya clan, in the world of early Vedic religion, an ancestor of later Hinduism. His teaching doesn’t center on a creator God. Traditional Buddhism includes karma and rebirth; modern secular Buddhism keeps the practices without them.",
 prac:"When a strong feeling hits, name it silently (‘frustration’) and watch how it changes over one minute.",
 book:"The Heart of the Buddha’s Teaching by Thich Nhat Hanh",al:"Dōgen, Erich Fromm",ri:"Craving",
 taunt:"What are you clinging to right now?"},
laozi:{n:"Laozi",m:"L",ep:"The Old Master",d:"Traditionally 6th century BC",pl:"China",r:"rare",mv:"Water’s Way",st:[8,9,7,9],
 core:"The Tao, ‘the Way,’ is the natural flow of all things. Stop forcing; act with ease and humility, like water.",
 term:["Wu wei","Effortless action: working with the grain of things instead of forcing them."],
 pw:["Water’s Way","Helps you act like water: yielding and unforced, working with things instead of against them."], /* Phase 39: the card power (D8) */
 rel:"Philosophical Taoism (his book) came first. Religious Taoism, with temples, deities, and practices for long life, later honored Laozi himself as a divine figure. Some scholars doubt he was a single real person.",
 prac:"In your next disagreement, listen twice as long as you speak before pushing your view.",
 book:"Tao Te Ching, Ursula K. Le Guin’s version",al:"Zhuangzi",ri:"Confucius (too many rules)",
 taunt:"The harder you push, the less you’ll find."},
zhuangzi:{n:"Zhuangzi",m:"Z",ep:"The Butterfly Dreamer",d:"c. 369–286 BC",pl:"China",r:"common",mv:"Butterfly Dream",st:[7,9,7,7],
 core:"Loosen rigid thinking. Through funny, strange stories, he shows that our labels, like ‘useful,’ ‘normal,’ and even ‘me,’ are less fixed than we think.",
 term:["The useless tree","A gnarled tree ‘useless’ for lumber survives for centuries. What looks useless may be exactly what lets you thrive."],
 pw:["Butterfly Dream","Loosens rigid thinking, so you can see from many points of view and find worth even in “the useless tree.”"], /* Phase 39: the card power (D8) */
 rel:"Part of philosophical Taoism. Relaxed about death and ritual; after grieving his wife, he drummed and sang, seeing death as part of nature’s constant change.",
 prac:"Find one thing you’ve labeled ‘useless’ or ‘off-track’ in your life and ask what it might be good for.",
 book:"The Path by Michael Puett and Christine Gross-Loh",al:"Laozi",ri:"Confucius",
 taunt:"Are you a player dreaming of a game, or a game dreaming of a player?"},
confucius:{n:"Confucius",m:"C",ep:"The First Teacher",d:"551–479 BC",pl:"State of Lu, China",r:"rare",mv:"Ritual Bond",st:[9,7,7,10],
 core:"You become a good person through your relationships and daily practices of respect. Goodness is practiced, not just believed.",
 term:["Ren","Humaneness: genuine goodness and care toward others."],
 pw:["Ritual Bond","Helps you grow ren, true humaneness, through respect, courtesy, and care in everyday relationships."], /* Phase 39: the card power (D8) */
 rel:"Spoke of Heaven as a moral order and honored ancestor rituals, but focused on this life. Whether Confucianism is a religion is still debated.",
 prac:"Pick one daily routine with someone you love and give it full, respectful attention.",
 book:"The Path by Michael Puett and Christine Gross-Loh",al:"Aristotle",ri:"Laozi, Zhuangzi",
 taunt:"Show me how you treat others, and I’ll know who you are."},
dogen:{n:"Dōgen",m:"D",ep:"The Zen Cook",d:"1200–1253",pl:"Japan",r:"rare",mv:"Just Sitting",st:[8,10,4,7],
 core:"Meditation isn’t a means to enlightenment; sitting itself is awakening. Every ordinary task, done with full attention, is practice.",
 term:["Shikantaza","‘Just sitting’: seated meditation without chasing any goal."],
 pw:["Just Sitting","Invites you to sit for its own sake, and shows that ordinary tasks done with attention are practice too."], /* Phase 39: the card power (D8) */
 rel:"A Buddhist monk who traveled to China to study, then founded the Sōtō school of Zen in Japan. For him, meditation is the religious life itself.",
 prac:"Do one chore a day with complete attention, as if it were meditation.",
 book:"Zen Mind, Beginner’s Mind by Shunryu Suzuki (a modern Sōtō teacher)",al:"The Buddha",ri:"Distraction",
 taunt:"Just answer. Nothing extra."},
aquinas:{n:"Thomas Aquinas",m:"TA",ep:"The Angelic Doctor",d:"1225–1274",pl:"Italy and Paris",r:"rare",mv:"Faith and Reason",st:[6,10,3,9],
 core:"Faith and reason work together. Moral rules are built into human nature, and reason can discover them because they reflect God’s design.",
 term:["Natural law","Moral principles built into human nature that anyone can discover by reason."],
 pw:["Faith and Reason","Helps you let faith and reason work together, and find the good through natural law that every reasoning mind can know."], /* Phase 39: the card power (D8) */
 rel:"A Dominican friar and Catholic saint. He believed faith and reason can’t truly conflict, since both come from God, and he blended Aristotle into Christian theology.",
 prac:"On a hard question, write what reason says and what your faith or deepest values say. Where do they agree?",
 book:"Aquinas: A Beginner’s Guide by Edward Feser",al:"Aristotle",ri:"Nietzsche",
 taunt:"Faith and reason, together. Bring both."},
kant:{n:"Immanuel Kant",m:"IK",ep:"The Universal Law",d:"1724–1804",pl:"Königsberg, Prussia",r:"epic",mv:"Universal Test",st:[7,10,2,10],
 core:"Morality comes from reason and duty, not outcomes. Act only in ways you’d want everyone to act, and never treat people as mere tools.",
 term:["Categorical imperative","A moral rule that applies no matter what you want: act only in ways you could will everyone to act."],

/* ============ CONVERSATIONS (Level I) ============ */
const TALK={
 kierkegaard:{
  intro:["You made it to the edge. Most people never leave that ledge behind me.","They wait for the crowd to decide who they should be. But a self has to be chosen, and choosing is frightening.","Walk with me a moment, Wanderer."],
  q:[
   {say:"When you stand before a real choice and your head spins, what is that feeling, as I see it?",
    o:["The dizziness of freedom: sensing all the selves you could become","A warning from your conscience that one of the options is sinful","Your mind’s fear of choosing wrong and being blamed for it later","A sign to wait until reason gives you a clear and certain answer"],
    w:"I call it anxiety, the dizziness of freedom. It isn’t a malfunction. It’s what real possibility feels like.",fb:["Conscience speaks about right and wrong. This dizziness comes before any wrong has been done.","Blame belongs to other people’s judgment. What I mean happens between you and your own possibilities.","Reason will never hand you certainty here. Waiting for it is just another way of not choosing."]},
   {say:"I describe three ways a person can live, from the shallowest to the deepest. Which order is mine?",
    o:["Chasing pleasure, then committing to duty, then living by faith","Living by faith, then chasing pleasure, then committing to duty","Committing to duty, then living by faith, then chasing pleasure","Chasing pleasure, then living by faith, then committing to duty"],
    w:"First the aesthetic life, chasing pleasure. Then the ethical life, committing to duty. Deepest is the religious life, staking everything on faith.",fb:["You have my three stages, but faith is the deepest, not the first.","Pleasure comes first for most people, not last. Start again from the shallowest end.","Close. You have the first stage right, but duty comes before faith, not after it."]},
   {t:"s",say:"A man in town goes to church every Sunday because everyone does. It changes nothing about how he lives. What would I tell him?",
    o:["Faith is a passionate personal choice, not a habit borrowed from the crowd","Showing up faithfully is itself a quiet act of devotion worth honoring","Religion is a comforting story, and he should find the courage to drop it","He should first prove God exists by reason, and then his faith will deepen"],
    w:"That was my whole quarrel with the church of my day. Faith had become a comfortable custom instead of a personal commitment.",fb:["That’s generous, but it’s exactly the comfortable habit I spent my last years attacking.","That’s closer to Nietzsche than to me. I never wanted faith abandoned.","Reason can’t get you there. Faith is a leap, not a conclusion you argue your way into."]}],
  reflect:"Where in your life are you following the crowd instead of choosing for yourself?",bye:"Go on. Leap. The bridge only appears for those who step.",back:"Back at the edge again? Good. Most people only come here once."},
 nietzsche:{
  intro:["So. You climbed.","Up here the air is thin and honest. Down there, people still lean on beliefs that have quietly collapsed.","I don’t knock things down for fun. I want to find out what’s strong enough to build on."],
  q:[
   {say:"People quote me: “God is dead.” What was I actually warning about?",
    o:["Culture was losing the belief its values rested on, and hadn’t faced it","Science had finally proven that no God exists, so religion should end","The churches had grown corrupt, and they needed to be torn down and rebuilt","Religion was already dying out, so its ending was hardly worth mentioning"],
    w:"It was a diagnosis, not a victory cry. When a shared belief fades, the values built on it start to wobble, and nihilism creeps in.",fb:["I proved nothing in a laboratory. This was a diagnosis of a culture, not a scientific result.","I wasn’t calling for reform. The foundation itself was already gone, and no rebuilding fixes that.","Hardly worth mentioning undersells it badly. Losing that foundation opened a gap people hadn’t yet faced."]},
   {say:"Here is my favorite test, the ‘eternal recurrence.’ What is it really asking you?",
    o:["Could you welcome living your exact life again, forever, pain and all?","Do you believe your soul will return in another body after you die?","Can you learn from the past so that history stops repeating itself?","Would you live differently if you knew you would be judged at the very end?"],
    w:"It tests how fully you can say yes to your life, every joy and every pain. Loving it that completely is amor fati, love of fate.",fb:["That’s reincarnation, a belief about the afterlife. Mine is a test aimed at how you live now.","Repetition isn’t the problem to solve here. It’s the test itself.","There’s no judge in my thought experiment, no one weighing you at the end."]},
   {t:"s",say:"A friend says, “Nothing matters anyway, so why try?” What would I say back?",
    o:["That is nihilism. Your task is to create values and say yes to life","You’re right. Accept that nothing matters and find peace in that","Meaning comes from a divine plan, even if you can’t see it yet","Do whatever brings the greatest happiness to the greatest number of people"],
    w:"Nihilism is the danger I warned about, not my conclusion. When old meanings fall, we must create new ones worth living by.",fb:["That’s surrender to the very sickness I warned about, dressed up as peace.","That’s the old comfort I said was fading. I have no hidden plan to hand you.","That’s Mill’s calculation. You’ll meet him later. I’m after something more personal than a formula."]}],
  reflect:"What part of your life would you gladly live again, exactly as it was?",bye:"Say yes to your life, Wanderer. All of it.",back:"Still climbing? Good. The view only gets more honest."},
 camus:{
  intro:["Ah, company. Mind the boulder.","I push it up. It rolls back down. I push it again. Some would call that pointless.","I call it mine. Let me show you what I mean."],
  q:[
   {say:"Look up. The sky says nothing, however loudly we ask. What do I mean by ‘the absurd’?",
    o:["The clash between our hunger for meaning and a silent universe","The idea that life is a joke that no one should take seriously","The belief that the universe is hostile and working against us","The feeling that other people’s choices make no sense to us"],
    w:"The absurd isn’t in us or in the world alone. It lives where our demand for meaning meets the world’s silence.",fb:["Not that kind of absurd. Mine is a collision, not a joke.","Hostile would almost be comforting. At least someone would be listening.","It isn’t about other people. Look up at that sky again."]},
   {say:"I like to picture Sisyphus happy as he pushes his boulder uphill. Why would he be?",
    o:["He owns his fate and makes the struggle itself his life","He trusts the gods will one day reward his endurance","He has forgotten why he pushes, so he feels no pain","He knows that someday the boulder will stay at the top"],
    w:"Sisyphus sees his fate clearly and chooses it anyway. By owning the struggle, he rises above it. That is what I call revolt.",fb:["No reward ever comes. His happiness has to be found inside the punishment, not after it.","He knows exactly what’s happening to him. Forgetting was never the escape I had in mind.","It never stays. The boulder always rolls back down, and that’s the whole point."]},
   {t:"s",say:"Say your work will never feel cosmically meaningful. What would I have you do?",
    o:["Do it fully and honestly anyway, finding value in the living itself","Trust that it serves a larger plan you simply cannot see yet","Walk away from it, since effort without ultimate meaning is wasted","Stop asking such questions and just keep your head down at work each day"],
    w:"I rejected both despair and the leap into ready-made meaning. Live with open eyes and full attention. That is the revolt.",fb:["That’s the leap of faith I call philosophical suicide, trading the truth for comfort.","That’s despair, the other trap. I’m after a third way, neither faith nor giving up.","That’s just looking away. I want you living with your eyes open, questions and all."]}],
  reflect:"What boulder do you push every day, and what could let you smile while pushing it?",bye:"Keep pushing. And smile on your way up.",back:"Back to push with me? Grab the other side."},
 sartre:{
  intro:["Welcome to the hall of doors. Every one of them is open.","That’s the frightening part. No one keeps you here but you.","Let’s talk about freedom, and the excuses we use to escape it."],
  q:[
   {say:"I say existence comes before essence. What does that mean for you?",
    o:["You exist first, then define yourself through what you choose","Your true nature is fixed at birth and slowly revealed over time","Your body comes first, and your character forms around it later","What you are inside matters more than anything you actually do"],
    w:"There’s no blueprint for being human. You show up first, and your choices make you who you are.",fb:["There’s no fixed nature waiting to be revealed. That’s exactly the blueprint I say doesn’t exist.","This isn’t a claim about biology. It’s a claim about freedom and choice.","For me it’s the reverse. You are what you do; there’s no separate inner self to fall back on."]},
   {say:"The waiter I wrote about plays his role a little too perfectly. I call that ‘bad faith.’ What is it?",
    o:["Pretending you’re a fixed thing with no choice, when you’re free","Losing your religious faith and hiding it from the people around you","Breaking a promise and then refusing to admit that you broke it","Doing your job badly on purpose to quietly protest your employer"],
    w:"Bad faith is lying to yourself about your freedom, hiding behind a role, a rule, or a circumstance as if you had no choice.",fb:["Nothing to do with which faith you hold. This is about lying to yourself, not about doctrine.","That’s an ordinary betrayal of someone else. Bad faith is a betrayal of your own freedom.","That’s a protest, and at least it’s a chosen one. Bad faith hides from choice instead."]},
   {t:"s",say:"A manager tells you, “I had to cut corners. The company made me.” What would I say?",
    o:["That’s bad faith. You still chose, and the choice is yours to own","He’s right. Pressure from the company removes his responsibility","It’s acceptable, as long as cutting corners turned out well overall","He should follow the company rules exactly, whatever it costs"],
    w:"Pressure is real, but it doesn’t erase freedom. “I had no choice” is usually a way of hiding from a choice.",fb:["The company can’t choose for him. Only he can, and only he answers for it.","I’m not weighing outcomes here; that’s Mill’s game. I’m asking who made the choice.","Hiding behind the rules is just another excuse. Following them is still a choice he owns."]}],
  reflect:"What’s one choice you’ve been calling “no choice”?",bye:"Choose, Wanderer. Not choosing is also a choice.",back:"You came back. That was a choice too, you know."},
 beauvoir:{
  intro:["Look at them, each locked in a separate cage.","Freeing only yourself was never the point. Freedom grows when we share it.","Come. Help me with these threads."],
  q:[
   {say:"These cages open together or not at all. What did I add to the idea of freedom?",
    o:["My freedom depends on others being free, so I must support theirs","Freedom means doing whatever I want, as long as it stays legal","Real freedom means turning inward and quietly setting your attachments down","Freedom is an illusion, since society shapes every choice we make"],
    w:"No one is free alone. Using people as stepping stones undercuts the very freedom you claim for yourself.",fb:["That’s freedom with no one else in it. Mine always comes bound to other people.","That sounds closer to a path you’ll hear of in the Misty Valleys. I wanted freedom lived out among people.","Society shapes us, yes, but never completely. And what shapes us, we can change together."]},
   {say:"In The Second Sex, I wrote about what it means to be a woman. What did I argue?",
    o:["Much of it is taught by society and upbringing, not fixed by biology","It is fixed by biology, and society should simply accept that fact","It is a private matter that philosophy has no business examining","It is freely chosen by each woman, with no influence from society"],
    w:"Much of what gets called ‘natural’ for women is actually learned, shaped by expectations from childhood on.",fb:["That’s precisely the assumption my book spent hundreds of pages taking apart.","I thought it belonged at the center of philosophy, not outside it.","If only it were that free. Think about what girls are told from childhood on."]},
   {t:"s",say:"You reach a big goal, but only by holding a teammate back. What would I say about that win?",
    o:["You’ve shrunk your own freedom by shrinking theirs","A win is a win, and what matters is that you reached it","It’s fine as long as the company benefited overall","It was bound to happen, so there’s no point feeling responsible"],
    w:"Real freedom builds up the freedom of others. A victory won by caging someone else is smaller than it looks.",fb:["A win that shrinks someone else’s freedom is smaller than it looks, whatever the scoreboard says.","I’m asking about a person’s freedom, not the company’s bottom line.","Nothing was bound to happen. A choice was made, and it had a cost for someone else."]}],
  reflect:"Whose freedom does your own depend on, and how could you widen theirs?",bye:"Walk on, and leave every door you pass a little more open.",back:"Welcome back. There’s always another cage to open."},
 frankl:{
  intro:["Careful where you step. This place has seen a great deal of suffering.","I learned that much can be taken from a person, but not everything. Not the attitude we choose.","Sit with me while I light these."],
  q:[
   {say:"Each of these lanterns went out once, and I relit them the same three ways. Where does meaning come from?",
    o:["Creating something, loving someone, and how we face unavoidable suffering","Achieving success, earning respect, and building lasting financial security","Seeking pleasure, avoiding pain, and keeping free of burdensome duties","Following the rules, obeying authority, and keeping your traditions"],
    w:"Through what we give to the world, what we receive from it in love and experience, and the stand we take toward suffering we can’t change.",fb:["None of those held up in the camps. What mattered there was much simpler than success.","That’s close to Freud’s idea that pleasure drives us. I found meaning where there was almost no pleasure at all.","Rules and traditions can support a life, but obedience alone never gave anyone a reason to live."]},
   {say:"I named my way of healing after the Greek word for meaning. What did I call it?",
    o:["Logotherapy","Psychoanalysis","Cognitive therapy","Humanistic therapy"],
    w:"Logos means meaning. Freud said we’re driven by pleasure, Adler by power. I said our deepest drive is the will to meaning.",fb:["That’s Freud’s approach. Mine grew partly out of disagreeing with his.","That came later, and it works on patterns of thought. Mine is named for meaning itself.","I’m often counted in that broad family, but my approach has its own name, from the Greek for meaning."]},
   {t:"s",say:"A friend is facing a hardship they can’t change. How would I help them?",
    o:["Help them find meaning in how they face it and whom they live for","Encourage them to stay busy so they won’t have to think about it","Remind them that suffering happens for reasons we can’t understand","Suggest that pain is optional if they can think positively enough"],
    w:"When we can’t change a situation, we are challenged to change ourselves. The attitude we choose can still carry meaning.",fb:["Distraction isn’t meaning. Looking away never helped anyone carry what they couldn’t change.","I did believe in a meaning beyond our understanding. But that alone leaves your friend with nothing to do.","Pain in the camps was never optional, however positively anyone thought. Something else was still ours."]}],
  reflect:"What gives you a “why” right now, even on the hard days?",bye:"Whatever the road asks of you, answer it with purpose.",back:"Ah, Wanderer. Help me keep these lit a while."},
 fromm:{
  intro:["Let them fall. Coins, trinkets, all the things we think we need.","We spend so much of life collecting, and so little of it actually living.","Tell me, Wanderer. Which are you here to do?"],
  q:[
   {say:"Watch these things fall away. I describe two ways of living, having and being. What’s the difference?",
    o:["Having defines you by what you own; being, by what you do and share","Having means striving for success; being means resting and doing little","Having is for practical people; being is for spiritual people only","Having means providing for others; being means focusing on yourself"],
    w:"In the having mode, we are what we possess. In the being mode, we are what we do, love, and experience.",fb:["Just the reverse of what I meant. Being is the fuller way to live, not the lazier one.","Being isn’t reserved for the spiritual. It’s how anyone can meet an ordinary day.","Providing for others can be love in action. That’s nothing like the having mode."]},
   {say:"People think love is something you fall into. I wrote that it’s something else. What?",
    o:["An art you practice, built on care, responsibility, respect, and knowledge","A rare stroke of luck that happens to most people only once or twice in life","A chemical rush that fades, which is why commitment matters more","A feeling you can’t control, so you should follow wherever it leads"],
    w:"Love is an art, like music or carpentry. It takes practice, patience, and attention, not just the right person.",fb:["That’s the popular myth I wrote the book to argue against.","Chemistry may spark it, but a rush is something that happens to you. I meant something more active.","Following a feeling isn’t the same as loving. I wrote that love asks far more of us."]},
   {t:"s",say:"You buy something that was supposed to make you happy, and a week later you feel restless. Why, as I see it?",
    o:["You looked to having for something only being can give you","You simply chose the wrong thing and should try something else","Happiness is always fleeting, so feeling restless is just normal","You haven’t yet earned enough to buy what you really want"],
    w:"No possession can fill a hunger that comes from not fully living. That restlessness is the having mode running out.",fb:["That only feeds the same hunger. Another purchase won’t fix what the last one couldn’t.","I’m not that bleak. Fulfillment is very possible, just not through more owning.","More money only buys more of the same restlessness."]}],
  reflect:"Where are you living in “having” mode, and what would “being” look like there?",bye:"Go gently. Be more than you have.",back:"Back in the garden? Stay as long as you like."},
 /* ---- Level II: the Marble Coast ---- */
socrates:{intro:["So. You’ve found the agora, or what’s left of it. Sit, if a column will still hold you.","I don’t hand out answers here, Wanderer. I only ask questions until an answer either survives or falls apart.","Let’s test something you already think you know."],q:[{say:"I told the jury that condemned me why I wouldn’t stop questioning. What did I mean by “the unexamined life is not worth living”?",o:["A life you never stop to question isn’t worth much, however comfortable","A life without formal schooling has no real value at all","Anyone who breaks the city’s own laws deserves whatever punishment eventually follows","Only philosophers live lives that truly matter to anyone"],w:"I didn’t mean schooling, and I didn’t mean philosophers alone. I meant a life lived on autopilot, never tested by a single honest question, isn’t worth much, however comfortable it feels.",fb:["Schooling was never my target. Plenty of the unschooled examine their lives closely, and plenty of the schooled never do.","That’s not what condemned me, and it isn’t my claim either. Obeying the law and examining your life are two different questions.","I never said only philosophers matter. I said the examining matters, and anyone at all can do it."]},{say:"A friend once asked the oracle at Delphi whether anyone was wiser than me. It said no one was. What was my wisdom, as I explained it?",o:["Knowing that I don’t know is wiser than assuming I do","The god chose me because I was never once wrong","I had simply studied more subjects than my rivals had","I had grown skilled enough to win most arguments I entered"],w:"I went looking for someone wiser and found only people who thought they knew, when they didn’t. My only edge was admitting my own ignorance.",fb:["The god played no favorites that I could find. I went looking for someone wiser and simply couldn’t disprove the oracle.","I claimed no wide learning. Whatever wisdom I had was smaller and stranger than that.","Winning arguments was never the aim. I lost plenty, gladly, the moment a better answer showed itself."]},{t:"s",say:"A man in the agora insists he already knows what justice is, and grows angry the moment you press him. What would I do?",o:["Ask him one question at a time until his own answer breaks down","Tell him plainly, right away, that his definition is wrong","Agree with him quickly so the conversation can stay peaceful","Report his error to the city council for judgment"],w:"I’d rather ask than tell. Question by question, a definition either survives or shows its own cracks. That’s the method, not a lecture.",fb:["I rarely just declared someone wrong outright. I asked until the answer undid itself.","Peace bought by silence was never peace I valued. A live disagreement teaches more than a smoothed-over one.","That was never my method. I answered to no council; I only ever asked questions."]}],reflect:"What’s one belief you’ve never really questioned?",bye:"Go on, and keep asking. The city rarely thanks you for it, but go anyway.",back:"Back at the agora? Good. There’s always another belief worth testing."},
 aristotle:{intro:["Walk with me. My students and I never sat still to think; we walked this colonnade instead.","You want the good life? Not a mood that passes. A whole life, lived and acted well, start to finish.","Let’s test what you already believe about becoming good."],q:[{say:"My word for the goal of a whole life, well lived, gets translated as “happiness.” What did I actually mean by it?",o:["Flourishing: living and acting excellently, day after day","A pleasant mood that comes and goes with each passing stroke of luck","Wealth and status, earned across a long career","A comfortable life, kept free of duty and difficulty"],w:"Eudaimonia isn’t a passing mood. It’s flourishing: a whole life lived and acted well, built through habit, not handed to you by luck.",fb:["A mood rises and falls with the weather. What I meant holds steady across a whole life.","Wealth can support a flourishing life, but it was never the goal itself for me.","Freedom from difficulty isn’t flourishing. Facing difficulty well is closer to what I meant."]},{say:"Take courage. I place it between two failures. Which pair, and how do you actually get there?",o:["Between cowardice and rashness, reached by practicing brave acts","Between kindness and cruelty, reached by reading moral texts and stories","Between wealth and poverty, reached by careful budgeting","Between silence and speech, reached by public debate"],w:"Courage sits between cowardice and rashness. And you don’t reach it by reading about it. You become brave the way you become a builder: by doing the thing, again and again.",fb:["Kindness and cruelty aren’t the pair courage sits between. Try again with fear and recklessness in mind.","That pairing suits a household budget, not a virtue. Courage isn’t measured in coin.","Debating well is its own virtue, but it isn’t the mean I meant for courage."]},{t:"s",say:"A friend keeps rushing into danger without a thought, and calls it bravery. What would I tell them?",o:["That’s rashness, not courage; true courage weighs the danger first","They should be praised, since more danger always shows more courage","They should avoid every risk from now on, to stay safe","Courage can’t really be judged; it’s just a matter of taste"],w:"Rashness only looks like courage. The brave person feels the fear, weighs it, and acts anyway for the right reason, not for the thrill of danger itself.",fb:["More danger isn’t more courage. Reckless risk is its own failure, opposite cowardice but just as far from the mean.","Swinging all the way to caution just trades one failure for the other. The mean sits between them, not at either end.","I don’t leave virtue to taste. There’s a truer and a falser courage, and habit is how you tell them apart."]}],reflect:"Which virtue do you want to build, and what small act would practice it this week?",bye:"Go practice it, Wanderer. Excellence is built one act at a time.",back:"Back on the colonnade? Good. Character never stops needing the walk."},
