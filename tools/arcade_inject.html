<!-- ============ ARCADE (test page only): every mini-game and boss round, practice only, nothing saved ============ -->
<style>
#arcade{z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;color:var(--parch);
  background:radial-gradient(ellipse at 50% 0%,#2E2240 0%,#16101F 55%,#0E0B1A 100%) fixed}
#arcade .aw{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
#arcade header{display:flex;flex-direction:column;gap:6px;text-align:center}
#arcade .ak{font-family:var(--f-head);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#arcade h1{font-family:var(--f-title);font-size:30px;line-height:1.1;margin:0;text-wrap:balance;color:#FFE9B8}
#arcade .an{font-family:var(--f-story);font-size:16px;line-height:1.4;margin:0;color:rgba(241,230,207,.78)}
#arcade .note{align-self:center;font-family:var(--f-head);font-size:14px;letter-spacing:.04em;padding:4px 12px;border-radius:99px;border:1.5px solid rgba(245,198,106,.35);color:#F5C66A}
#arcade section{display:flex;flex-direction:column;gap:10px}
#arcade h2{font-family:var(--f-head);font-size:21px;font-weight:400;margin:0;display:flex;align-items:center;gap:10px;color:var(--parch)}
#arcade h2 i{width:12px;height:12px;border-radius:3px;background:var(--lc);box-shadow:0 0 0 1.5px var(--lead),0 0 10px var(--lc)}
#arcade .ag{border:3px solid transparent;border-radius:12px;background:var(--glass) padding-box,var(--band) border-box;box-shadow:0 0 0 1.5px var(--lead),0 6px 18px rgba(0,0,0,.35);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
#arcade .ag.boss{background:var(--glass) padding-box,var(--bandgold) border-box}
#arcade .at{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
#arcade .at b{font-family:var(--f-head);font-weight:400;font-size:19px;color:#FFF3DA}
#arcade .at span{font-family:var(--f-story);font-size:15px;color:rgba(241,230,207,.7)}
#arcade .ab{display:flex;gap:8px;flex-wrap:wrap}
#arcade .ab button{flex:1 1 30%;min-width:0;min-height:44px;font-family:var(--f-head);font-size:16px;letter-spacing:.02em;color:var(--parch);border-radius:10px;padding:8px 10px;
  border:1.5px solid rgba(245,198,106,.35);background:rgba(14,11,26,.6);cursor:pointer}
#arcade .ab button:hover{border-color:rgba(245,198,106,.75)}
#arcade .ab button:focus-visible{outline:2px solid #F5C66A;outline-offset:2px}
#arcade .ab button small{display:block;font-family:var(--f-story);font-size:13px;color:rgba(241,230,207,.65);letter-spacing:0}
#arcade .foot{font-family:var(--f-story);font-size:14px;line-height:1.4;color:rgba(241,230,207,.6);text-align:center;margin:0}
</style>
<section id="arcade" class="layer" aria-label="Mini-game arcade"><div class="aw">
  <header><p class="ak">The Examined Life</p><h1>Mini-game Arcade</h1>
    <p class="an">Every mini-game and boss round, ready to play. Games with stages can start at any stage.</p></header>
  <p class="note">Practice only · nothing here is saved</p>
  <div id="arcList" style="display:flex;flex-direction:column;gap:26px"></div>
  <p class="foot">Pause (☰) any time to start over or leave. Lanterns show for each run only.</p>
</div></section>
<script>
(function(){
  /* practice only: nothing is written anywhere */
  saveLocal=function(){};persist=function(){};saveMiniResult=function(){};miniAwardArt=function(){};
  const arc=$("#arcade"),list=$("#arcList");
  const LV=[["l1","Level I"],["l2","Level II"],["l3","Level III"],["l4","Level IV"]];
  function row(id){const g=MINI[id],who=g.boss?"Boss round":speakerName(g.who),st=g.stages||[];
    const btns=st.length&&g.toStage&&!g.short?st.map((nm,i)=>`<button data-arc="${id}" data-st="${i}">Stage ${ROMAN[i]}<small>${esc(nm)}</small></button>`).join("")
      :`<button data-arc="${id}" data-st="0">Play</button>`;
    return `<div class="ag${g.boss?" boss":""}"><div class="at"><b>${esc(g.title)}</b><span>${esc(who)}</span></div><div class="ab">${btns}</div></div>`}
  function render(){list.innerHTML=LV.map(([k,nm])=>{const ids=Object.keys(MINI).filter(id=>MINI[id].land===k);if(!ids.length)return "";
    const lc=(LEVEL_DEFS[k]&&LEVEL_DEFS[k].accent)||"var(--"+k+")",reg=REGIONS[k]?" · "+REGIONS[k]:"";
    ids.sort((a,b)=>(!!MINI[a].boss)-(!!MINI[b].boss));
    return `<section style="--lc:${lc}"><h2><i></i>${nm}${esc(reg)}</h2>${ids.map(row).join("")}</section>`}).join("")}
  function open(){arc.classList.remove("hide")}
  const _show=show;
  show=function(id){if(id==="world"||id==="title"||id==="talk"){TK=null;_show("title");open();return}arc.classList.add("hide");_show(id)};
  miniLeave=function(){closeMini()};
  const _card=miniCard;
  miniCard=function(){_card();if(!MS||!MS.boss)return;const b=$("#mCard .mbtns");if(!b)return;
    if(MS.mode==="result"&&!b.querySelector('[data-act="magain"]'))b.insertAdjacentHTML("beforeend",'<button class="reply soft" data-act="magain">Play again</button>');
    if(MS.mode!=="result"&&!b.querySelector('[data-act="mleave"]'))b.insertAdjacentHTML("beforeend",'<button class="reply soft" data-act="mleave">Leave</button>')};
  list.addEventListener("click",e=>{const t=e.target.closest("[data-arc]");if(!t)return;e.stopPropagation();sfx("tap");
    const id=t.dataset.arc,n=+t.dataset.st||0,g=MINI[id];if(!g)return;
    startMini(id,{replay:true});
    if(n>0&&g.toStage&&MS){MS.s=newMiniState(g);g.toStage(MS.s,n);miniPips()}});
  render();show("title");
})();
</script>
